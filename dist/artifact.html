Fields 1\u20133 are the fixed block: copy them word for word from my last Ledger and change only what this module changed, marking each change with this module, e.g. "(M8)". Never shorten the cast lines, H1\u2013H3, the bid conditions, the cap and what it includes, commercial figures, the contract form, the scores or the win themes; anything this module adds to fields 1\u20133 for the first time, copy word for word from this chat. Fields 4\u20138 roll: carry every decision with its conditions and every open item forward unless this module closed it (a decision whose content One truth already states needs only a short name and its module); copy word for word any lines a skill headed "Next stage needs \u2014 for Mx" and keep each until module x has run. Labels stay as they are ("H", "to confirm", "practice card"). Record as a decision only what I typed as a decision; everything else stays "Open". A rehearsal or simulation result is "rehearsed \u2014 not validated", never a client fact or an approval. Any condition in One truth whose date is on or before the date I typed (else today) is "met" only if this chat shows it; otherwise add to Open "missed \u2014 reopen qualification (renewal or change request: reopen that decision), for DCS decision". If the Ledger runs long, shorten Artefacts first and list under Open anything you removed; then merge Open items that share an owner, each part keeping its own date, and cut each item to what \xB7 with whom \xB7 by when \u2014 never drop one.

{{DISCIPLINE}}`,discipline:'Workshop output discipline \u2014 Return only what is requested above. No introduction, no recap, no commentary. Hard limits (source tags and labels not counted): (1) one line per check, max 20 words each; (2) one table, one row, 7 columns, max 15 words per cell; (3) the eight field names in bold, "\u2014" for an empty field; fields 1\u20133 in full as above; fields 4\u20137 max 350 words together; field 8 word for word. If information is missing, write: "Not provided \u2014 needs validation." Do not fill gaps unless labelled as an assumption. Close with one line: "Further detail available on request." Nothing after it. A turn that ends on a question or a request to me ends on that line, without this line. (Remove this block after the workshop to receive the full output.)'}],appendixB:[{title:"ROLE TITLES",body:'The skill comes with eight common role titles pre-loaded. Your unit staffs from different ones? Type your own 5\u201310 titles under your Ledger \u2014 titles only, no names: "Role profiles: \u2026". The skill labels generic profiles A and still shows which skills no profile evidences; it invents no company role catalogue.'},{title:"COVERAGE, AND WHAT COUNTS AS COMPETENCE",body:'Demonstrated means a source shows it \u2014 a delivery or reference in your case documents. A skill a profile does not mention is "not evidenced", not "incapable"; and a title never tells you who is available. Course enrolment is not competence: every gap gets a task that shows readiness when it is done well.'},{title:"COPILOT IN THIS MODULE",body:'Copilot in this module: your mail, chats and org chart hold real names and rates \u2014 in a test run, work mode pulled both into the gap map. Use your case agent, or start with "Use only the attached files."'},{title:"INTERNAL CASE, OR A CASE ABOUT PEOPLE",body:"Internal case, or a case about people (staffing, assignments, a reorganisation)? Same rule, stricter: role profiles only. The map is about the skills the work needs, never about whether a particular person has them."},{title:"PERSONAS AND JOURNEY",body:"Part 2 reads the cast in your Ledger. Your M2 personas or your M6 journey are not in the Ledger: paste them under part 2 if you want the plan to use them."},{title:"YOUR TOOL",body:'Copilot without a case agent, in your case chat: attach your Case Pack (and any file the card names) and start with "Use only the attached file." A private chat gets only what your card says. Everything else \u2014 workspace, private chat, preview, reusable skill \u2014 is on the tool card: Appendix B of your M0 guide, and the Workflow Skills Library.'}]}}};var ro={meta:{client:"Velmora Retail",title:"Re-tender: SIAM & product-data pilot (voorbeeldcase, fictief)",route:"tender",sector:"Retail (non-food discounter, NL)",role:"DCS on the bid",submissionDate:"2026-12-22",decisionDate:"2027-02-22",demo:!0},casepack:{docs:{"01":{text:`## \xA71 Client and context

A \u2014 Velmora Retail is the client: a Dutch non-food discounter headquartered in Tilburg, with 3,350\u20133,450 stores and 87,000\u201389,000 staff. Growth depends on standardised operations and frequent assortment changes.
A \u2014 Names are fictional, locations moved within the Netherlands, and supplied figures shifted approximately 10%; added operational and procurement details are invented.

## \xA72 Problem

A \u2014 Suppliers and specialist partners collect compliance and sustainability evidence, but Product Data Management (PDM) cannot consistently see handoffs. The fictional pilot-category baseline is 1,200 submissions monthly, 480 open cases and eight working days to approval and publication.

## \xA73 Why now

A \u2014 Cloud migration and a supplier portal already occupy Technology and Northmere Consulting, the incumbent. Management wants growth without proportional administrative recruitment. Additional initiatives must earn scarce change capacity.

## \xA74 What we heard

F [pasted interview] \u2014 The PDM contact wanted concise, internally shareable evidence before involving Supplier and Partner Management. CGI had no established relationship before discovery; its subsequent discussion deck received no response. The pursuit stalled without a confirmed rejection or competitive award.
F [pasted interview] \u2014 Learning focus: earn wider stakeholder access and dated mutual commitments from a cold lead.

## \xA75 Strategic gap

Which portfolio initiative could release change capacity: Not provided \u2014 needs validation.`,title:"Client brief",source:"demo"},"02":{text:`A \u2014 All procurement, evaluation, budget and commercial details below are invented replay assumptions.

## \xA71 Replay and purchase

Re-tender opens 12 November 2026 because the previous exploratory submission produced no decision and cross-party data ownership remains unresolved. The tender, funding and timetable are invented for the replay; CGI is an unselected bidder.
Buy a 12-week diagnostic and supervised pilot combining Service Integration and Management (SIAM) agreements with product-data definitions, evidence traceability and an AI-assisted exception workbench.

## \xA72 Scope

In: seasonal household goods, three suppliers, two evidence partners, handoff ownership, shared rules, performance reviews, prototype and supervised trial.
Out: platform replacement, cloud migration delivery, enterprise rollout and automated compliance or product-release decisions. Velmora Retail retains orchestration; existing teams and the incumbent retain delivery responsibilities.

## \xA73 Requirements

| ID | Priority | Requirement |
| --- | --- | --- |
| R1 | Must | Define shared product-data and evidence terminology. |
| R2 | Must | Assign an accountable owner and escalation route to every handoff. |
| R3 | Must | Link each evidence item to its product, supplier and collecting partner. |
| R4 | Must | Demonstrate the outcome measurement in 03 \xA73. |
| R5 | Must | Fit the existing platform and cloud programme. |
| R6 | Must | Provide approved hosting, role-based access and audit trails. |
| R7 | Must | Require human approval for release decisions and external communications. |
| R8 | Should | Use AI to summarise missing evidence and suggest exception routing. |
| R9 | Must | Include stakeholder commitments, dated review meetings and pilot stop criteria. |
| R10 | Should | Provide reusable partner-onboarding templates. |

## \xA74 Evaluation and authority

| Criterion | Weight | What evaluators want to see |
| --- | --- | --- |
| Measured value and adoption (Module 4) | 36% | Baseline, outcome logic, usable prototype and stakeholder commitments. |
| Delivery and incumbent fit | 24% | Responsibilities, dependencies and feasible staffing. |
| Whole-life cost | 22% | Transparent delivery and support costs. |
| Data and AI governance | 18% | Access controls, human review and traceability. |

Panel: Head of PDM, Director of Technology and Architecture, CFO, Head of Supplier and Partner Management. The Director decides; CFO funding approval is required. Head of PDM sponsors. All four are profiled in 04.

## \xA75 Timeline

| Event | Date |
| --- | --- |
| Opening | 12 November 2026 |
| Clarification deadline | 26 November 2026 |
| Moderated discovery | 3 December 2026 |
| Submission | 22 December 2026 |
| Decision | 22 February 2027 |
| Delivery | 8 March\u201328 May 2027 |

## \xA76 Budget

\u20AC115,000\u2013\u20AC135,000 excluding VAT. Worked case: \u20AC125,000 = \u20AC35,000 diagnostic + \u20AC90,000 pilot. Optional support: \u20AC12,000 annually, outside the pilot budget.

## \xA77 Procurement and contact

Private competitive invitation; maximum nine pages plus a three-page commercial schedule. Procurement is the sole contact; Q&A and moderated stakeholder access are shared equally. Previous contacts confer no private access.
Exclusions: late bids, missing Must responses, undisclosed subcontractors or unapproved data transfers.

## \xA78 Commercial and Legal

Permitted proposals: fixed fee or capped time-and-materials. Model payments: 20% mobilisation, 30% diagnostic acceptance, 50% pilot acceptance; 30-day invoice terms.
Questions for Legal: may liability be capped at 100% of pilot fees, with client-owned data, reusable supplier IP and termination after either accepted stage?
Incumbent exclusivity and third-party access rights: Not provided \u2014 needs validation.

## \xA79 Alternatives

Northmere Consulting offers incumbent continuity; Caldris Data offers specialist data-quality delivery. Internal delivery also competes for funding.`,title:"Opportunity or RFP summary",source:"demo"},"03":{text:`A \u2014 The process, systems, baseline, target and client rules below are invented case assumptions.

## \xA71 Process and systems

Suppliers send product data and evidence through portals or email. Evidence partners collect certificates separately. PDM reconciles identifiers and validity dates, chases gaps and raises integration issues with Technology.
Approved records enter Product Hub, the aliased master-data platform. Work Queue is the aliased ticketing system; spreadsheets bridge gaps. The incumbent supports the cloud and supplier-portal programme.
A case is one product-data or evidence submission; multiple cases may concern the same product.

## \xA72 Baseline

These are invented pilot-category assumptions, not enterprise totals.

| Measure | Baseline |
| --- | --- |
| Inflow | 1,200 cases/month |
| Completions | 1,200 cases/month |
| Team capacity | 8 FTE \xD7 120 productive hours/month = 960 hours/month |
| Handling time | 48 minutes/case, including rework |
| Open backlog | 480 cases, including processing and waiting |
| Mean cycle time | 8 working days/case |
| Rework | 25% of cases = 300 cases/month |
| Operating cost | \u20AC57,600/month = \u20AC48/completed case |

Assume 20 working days/month: 60 completions/day \xD7 eight days = 480 open cases; 1,200 \xD7 0.8 hours = 960 hours. Operating cost includes staff and allocated tools.

## \xA73 Client outcome

We want average submission-to-publication time reduced from eight to five working days by 30 June 2027.
Start: first receipt of a submission, including incomplete packs. Stop: approved record or evidence update published in Product Hub. Measure the pilot category, including all waiting time. Exclude withdrawn cases and report their count separately.
The PDM operational owner reports weekly from Work Queue receipt timestamps joined to Product Hub publication logs.

## \xA74 Data and AI rules

Business data: product identifiers, attributes, certificates, validity dates and partner performance. Personal data: supplier contact details and user audit logs.
Client rules: approved tenant only; no public-model uploads or training; minimum necessary access; encrypted storage; 90-day pilot retention; human approval of external messages and product release. Prototype records are synthetic; supervised trials use approved pseudonymised records.

## \xA75 Constraints and risks

Automated checks and manually maintained rules already exist. The portal upgrade improves capture; fragmented partner handoffs remain.
Risks include change overload, disputed ownership, incumbent resistance, AI overconfidence and parallel spreadsheets. Mitigations: agreed responsibilities, frontline testing, documented human review and escalation through existing managers.

## \xA76 Evidence gap

Pilot evidence partners\u2019 permission to share historical exception logs: Not provided \u2014 needs validation.`,title:"Current state and risks",source:"demo"},"04":{text:`## \xA71 Fictional stakeholder profiles

A \u2014 All eight people, their views and individual contact histories are fictional role-play assumptions.

| Person \xB7 role | Wants \xB7 fears | CGI stance \xB7 past contact | Paraphrased remark |
| --- | --- | --- | --- |
| Mara Veldhuis \xB7 Head of PDM \xB7 Sponsor, panel | Clear ownership; fears another initiative without operational support. | Interested but uncommitted; initial discovery and deck recipient. | Show enough practical value for me to involve colleagues. |
| Elias Meijer \xB7 Director of Technology and Architecture \xB7 Decision-maker, panel | Architectural consistency; fears disruption to existing programmes. | Cautious; no direct CGI discussion. | Explain how this fits our current delivery responsibilities. |
| Nora Koster \xB7 CFO \xB7 Funding approval, panel | Measurable benefits; fears savings that never release capacity. | Neutral; no previous CGI contact. | Distinguish faster processing from cash savings. |
| Jonas Verbeek \xB7 Procurement Lead | Comparable offers; fears informal commitments and unequal access. | Process-focused; manages replay communications. | Put questions through the shared clarification route. |
| Lena Vos \xB7 Data Protection and Risk Lead | Controlled access and traceability; fears inappropriate disclosure. | Open to supervised experimentation; no previous CGI contact. | Demonstrate permissions and human review before using operational records. |
| Daan Smit \xB7 Head of Supplier and Partner Management \xB7 Panel | Consistent partner obligations; fears unenforceable handoff agreements. | Interested in reusable governance; no direct CGI discussion. | Make responsibilities workable for partners as well as headquarters. |
| Sanne Bakker \xB7 PDM Operational Owner | Shorter queues; fears additional reporting and unclear escalation. | Pragmatic; attends moderated discovery. | Remove chasing work rather than create another dashboard. |
| Milan de Wit \xB7 Product-data Coordinator \xB7 Front-line user, sceptic | Reliable evidence; fears incorrect suggestions and duplicate administration. | Sceptical; meets CGI during moderated user research. | Let me inspect the evidence behind every recommendation. |

## \xA72 Authority and engagement

A [02 \xA74, \xA77] \u2014 The Director decides, subject to CFO funding approval. The four marked panel members evaluate. Sponsorship does not establish funding or authority.
Procurement coordinates stakeholder access. Previous contact with the sponsor provides no private route around the replay\u2019s contact rules.`,title:"Stakeholder notes",source:"demo"},"05":{text:`## \xA71 A coordinator\u2019s working day

A [03 \xA71\u2013\xA72] \u2014 Illustrative day for the front-line coordinator. These activities total six productive hours, consistent with 120 hours over 20 working days.

| Time | Task | Tool | Time or pain |
| --- | --- | --- | --- |
| 08:30 | Triage new submissions and urgent exceptions. | Work Queue | 30 minutes; priorities need interpretation. |
| 09:00 | Check identifiers, attributes and supporting evidence. | Product Hub, partner portals | 90 minutes; inconsistent identifiers slow matching. |
| 10:45 | Chase missing or expired evidence. | Email, partner portals | 45 minutes; ownership is unclear. |
| 11:30 | Recheck corrected submissions. | Work Queue, Product Hub | 45 minutes; corrections can introduce new gaps. |
| 13:00 | Reconcile evidence against product records. | Spreadsheet, Product Hub | 60 minutes; manual cross-checking. |
| 14:15 | Publish records after authorised approval. | Product Hub | 60 minutes; approval status needs checking. |
| 15:30 | Record handoffs and unresolved exceptions. | Work Queue | 30 minutes; repeated explanations. |

Other working time covers breaks, training and internal administration.

## \xA72 Workarounds and human boundaries

A \u2014 Coordinators maintain private tracking sheets, reuse chasing emails and ask familiar colleagues to identify owners.
They would never delegate final compliance acceptance, product release or supplier-facing commitments to a machine.

## \xA73 Work item fields

A \u2014 One work item is one submission, as defined in 03 \xA71.

| Field | Possible values |
| --- | --- |
| Product identifier | Synthetic unique code: VR- followed by five letters. |
| Submission type | New product; attribute change; evidence renewal. |
| Supplier | Supplier A; Supplier B; Supplier C. |
| Evidence status | Missing; received; expired; verified. |
| Case status | Received; validating; awaiting partner; awaiting approval; published; withdrawn. |
| Accountable party | PDM; supplier; evidence partner; Technology. |`,title:"User reality",source:"demo"},"06":{text:`## \xA71 Relationship and access

F [pasted interview; 01 \xA74] \u2014 CGI had no established relationship before discovery. The contact requested shareable SIAM material before involving colleagues. A deck was sent; no response followed.
A [02 \xA77] \u2014 During the replay, procurement controls communications and moderated access. Earlier contact does not permit separate discovery or privileged clarification.

## \xA72 Evidence CGI could develop

A \u2014 Proposed evidence, not established credentials:

- Comparable delivery \u2014 reference to validate.
- A worked handoff showing ownership, evidence lineage and escalation.
- A synthetic exception prototype with inspectable recommendations and human approval.
- A measurement demonstration using the start and stop events in 03 \xA73.
- A stakeholder commitment plan with dated reviews and explicit continuation criteria.

## \xA73 Delivery constraints

A [02 \xA71\u2013\xA72; 03 \xA74] \u2014 The diagnostic and pilot share the 12-week delivery window. Existing platforms remain; Velmora Retail retains orchestration. Prototype data is synthetic. Operational trials require approved records, controlled access and human review.

## \xA74 Role profiles

A \u2014 Capability menu for exercises; no staffing allocation is decided. Each skills description contains six words.

| Role | Skills |
| --- | --- |
| SIAM Lead | Service governance, handoffs, escalations, partners, accountability. |
| Product Data Analyst | Product definitions, validation, metadata, lineage, reconciliation. |
| Data Engineer | Pipelines, identifiers, integration, logging, access controls. |
| AI Prototype Engineer | Retrieval, summarisation, evaluation, guardrails, prototyping, observability. |
| Service Designer | User research, workflows, usability, adoption, facilitation. |
| Delivery Manager | Planning, dependencies, risks, milestones, coordination, reporting. |
| Risk and Privacy Specialist | Privacy assessments, minimisation, retention, permissions, oversight. |

## \xA75 Hindsight from the original bid \u2014 not part of the replay

F [pasted interview; 01 \xA74] \u2014 The pursuit stalled through silence. A confirmed rejection or competing award was not established.
H \u2014 Incumbent familiarity may have favoured continuity; no competing proposal can be ranked.
H \u2014 Three possible weaknesses to test: dependence on one contact; an unverified decision and funding route; insufficiently established value proof and a dated mutual next step. These are hypotheses, not findings about unseen proposal content.`,title:"Evidence themes",source:"demo"},canvas:{text:`Client \xB7 A \u2014 Velmora Retail; Dutch non-food discount retailer; no separate account.

RULES
- Facts come only from the sources below. Tag every line or table cell with F [source \u2014 file name and page or section], A (assumption) or H (hypothesis to validate). Where the sources are silent, write "Not provided \u2014 needs validation" \u2014 never invent a plausible detail. These gaps are the questions a director would chase: keep them visible, do not fill them.
