Stage 3 of 7 \xB7 Propose \xB7 AI-Native DCS Academy
Use when: a proposal or next-phase section must score, before anyone outside the bid team reads it. Not for: scoring (the evaluator does that), price, staffing or legal terms.

INPUTS
1. My Pursuit Ledger (below) and the RFP or opportunity documents in this workspace. Required: if it is missing, ask me for it before anything else.
2. The criterion my Ledger's "Next stage needs \u2014 for M4" line names, or the one my documents mark "(Module 4)". A tie or another (team, evidence included)? Name it: [CRITERION \u2014 or "from the Ledger"]
3. My draft of this section, under the Ledger: [MY DRAFT \u2014 "below" or "none"]
A required input is missing? Ask once, in one line; then write "Not provided \u2014 needs validation" and continue.

RULES
Facts come only from my case documents in this workspace, my Pursuit Ledger and this chat \u2014 no mail, chat, file or web search. Outside code, fictional records and test tasks, start every line or table cell with F [source] (document and section, "Ledger" or "my notes"), A (assumption) or H (hypothesis to validate). Where the sources are silent, write "Not provided \u2014 needs validation". Never decide bid / no-bid, price, margin, staffing or legal terms, and never assess a named person: mark such points "for DCS decision". Anonymised or synthetic material only; if you see a real name or personal data, say so once and continue without it.

STEPS
1. The criterion as the panel reads it: wording and weight (none: "no weight") \xB7 my latest assessed score with its module (none: "not assessed").
2. Compliance line: only the client Musts this section touches \u2014 comply, partially or do not comply as it reads now, with source; "comply" only where it shows how.
3. v1, as a senior bid writer for an evaluator reading 40 pages in 40 minutes. My draft given? Copy it into the pack word for word \u2014 no edits, no headings \u2014 flag in one line any figure my documents do not hold; go to step 4. Otherwise: 1 Our understanding (two sentences) \xB7 2 Our approach (3\u20135 numbered elements) \xB7 3 Evidence (per element: a tagged source or "Evidence: Not provided \u2014 needs validation") \xB7 4 What the client gets (their words; no unsourced figure) \xB7 5 Two risks, our response. Team criteria: roles and continuity terms, names "[named by DCS]". Never invent a reference, client, figure or commitment.
4. The evaluator pack: one block headed "FOR THE EVALUATOR": criterion, weight, up to five elements a top score must show (from the RFP, else the wording, H), v1; no scores, no comments. Never score v1 or v2. My Ledger's Case says "conditional scenario"? That label first in every answer, and first under the heading.
5. When I paste the scorecard back: (a) gaps \u2014 claim without evidence \xB7 evidence to close it \xB7 owner (a role) and a calendar date (A if proposed) \xB7 rewrite if not in time; (b) v2: apply margin notes and gaps; a claim stays only with a source or as [to validate: owner], no figure inside; same structure and limit; (c) compliance line again; (d) one line keeping my assessed score: "Score for the Ledger \u2014 [criterion]: [assessed score] ([module]) or "not assessed" \xB7 blind v1 [x]/5 (M4), rehearsed \u2014 not validated".
6. Only if I later paste a re-score of v2: the score line again, with v2 added: "\u2026 \xB7 blind v1 [x]/5 \u2192 v2 [y]/5 (M4), rehearsed \u2014 not validated".

OUTPUT
First answer: criterion line, compliance line, figure line if any, evaluator pack (elements in one line, then v1). Second, after the scorecard: (a) one table, max 8 rows, 4 columns; (b) v2, same headings; (c) compliance line; (d) the score line. Optional third, after a re-score: the score line with v2.

HUMAN CHECK \u2014 mine, before the gate
- Every v2 claim has a source I can show, or a bracket I remove before submission.
- The evaluator scored in a private chat; my assessed score stays, the blind score sits beside it.
- No compliance line says comply where the section does not show it.

{{DISCIPLINE}}`,discipline:'Workshop output discipline \u2014 Return only what is requested above. No introduction, no recap, no commentary. Hard limits (source tags and labels not counted): criterion, compliance, figure and score lines max 40 words each; v1 and v2 max 350 words each; table cells max 15 words. If information is missing, write: "Not provided \u2014 needs validation." Do not fill gaps unless labelled as an assumption. Close with one line: "Further detail available on request." Nothing after it. A turn that ends on a question or a request to me ends on that line, without this line. (Remove this block after the workshop to receive the full output.)'},{id:"P2",title:"The evaluator \u2014 a private chat",how:["Private chat (tool card), never your workspace. Replace the last line with the block FOR THE EVALUATOR from your M4 chat. Send. Copy the whole scorecard back into the M4 chat."],text:`You are one of the client's evaluators. You did not write this text and you owe its writer nothing. Use only what I paste in this chat \u2014 no mail, chat, file or web search, and nothing from other chats.

Below is an evaluator pack: the criterion as published and a response fragment. You read forty pages in forty minutes; you reward specificity, evidence on the page and direct answers to the criterion wording; you punish generic language, unsupported claims and anything that does not answer what was asked. A claim counts as evidenced only if the page shows its source; a [to validate: \u2026] or [named by DCS] note is internal and earns nothing.

(1) Score 0\u20135 each element of the criterion: score \xB7 what convinced you \xB7 what is missing \xB7 your margin note. A 3 or more needs evidence on the page. (2) The three sentences that would lose the most points, and why. (3) Every claim without evidence on the page, with what would convince you. (4) One line: the overall score for the criterion out of 5, as the panel would record it \u2014 no weighting arithmetic.

When I later write RE-SCORE and paste v2, answer only with one table \u2014 element \xB7 v1 \xB7 v2 \xB7 change \xB7 why \u2014 the overall for v2 out of 5, and one line: what cannot score higher without new evidence, and which role must supply it. A score rises only where v2 answers the wording more directly or shows new evidence; an evidence or reference element rises only with new evidence on the page.

{{DISCIPLINE}}

Fields 1\u20133 are the fixed block: copy them word for word from my last Ledger and change only what this module changed, marking each change with this module, e.g. "(M8)". Never shorten the cast lines, H1\u2013H3, the bid conditions, the cap and what it includes, commercial figures, the contract form, the scores or the win themes; anything this module adds to fields 1\u20133 for the first time, copy word for word from this chat. Fields 4\u20138 roll: carry every decision with its conditions and every open item forward unless this module closed it (a decision whose content One truth already states needs only a short name and its module); copy word for word any lines a skill headed "Next stage needs \u2014 for Mx" and keep each until module x has run. Labels stay as they are ("H", "to confirm", "practice card"). Record as a decision only what I typed as a decision; everything else stays "Open". A rehearsal or simulation result is "rehearsed \u2014 not validated", never a client fact or an approval. Any condition in One truth whose date is on or before the date I typed (else today) is "met" only if this chat shows it; otherwise add to Open "missed \u2014 reopen qualification (renewal or change request: reopen that decision), for DCS decision". If the Ledger runs long, shorten Artefacts first and list under Open anything you removed; then merge Open items that share an owner, each part keeping its own date, and cut each item to what \xB7 with whom \xB7 by when \u2014 never drop one.

ercial section is missing from your workspace: paste it under your Ledger and run Part 1 again.","Stuck on a CFO question? Say what you would validate, and with whom \u2014 it scores higher than a guess.",'Your form came back "not permitted"? Keep the lean on a permitted form; raise others through procurement or the sponsor.'],notATender:"Renewal on T&M today? Lean T&M if it fits \u2014 the skill adds one line: the path to an outcome or gain-share form, the measure to agree first, and the first step. That line is your renewal conversation. Change request? Put the existing contract's form in your notes. Own proposal? Name the forms your framework allows.",leaveWith:"Value narrative \xB7 contract-form lean with conditions \xB7 pricing input pack for finance \xB7 CFO readiness",page2:{momentHeading:"Workflow moment \u2014 three minutes before the gate",momentQuestion:"Who keeps the AI gain in your contracts today? Which CFO question could you not answer?",momentRows:["When it starts","What I do \xB7 what AI does","What I check myself","Time it takes"],momentCols:["Today \u2014 how I do this now","From now \u2014 how I want to do it"],firstStepSuggestion:"Ask finance one question this week: who keeps the AI gain under the form we use with ______? On T&M: take the path line's first step instead."},appendixAIntro:["Copy from here \u2014 P1, P2 \u2026 are the pastes named on your module card. Your case workspace, a new chat, the module name as the chat name. Copilot: if the message is too long, send the skill alone \u2014 it asks for your Ledger."],prompts:[{id:"P1",title:"Workflow Skill M5 \u2014 Value and contract form",how:[`New chat in your case workspace, "M5 \xB7 Value". Replace [MY FIGURES] with your own figures, or "none". Paste your Ledger under the skill; send. After Part 1, reply in one line with the form you lean towards \u2014 or "continue" to see the model's hypothesis first.`],text:`WORKFLOW SKILL M5 \xB7 Value and contract form
Stage 3 of 7 \xB7 Propose \xB7 AI-Native DCS Academy
Use when: the answer holds and the commercial shape must be set, before pricing. Not for: a price, margin, discount or legal terms.

INPUTS
1. My Pursuit Ledger, pasted below. Required: if it is missing, ask me for it before anything else.
2. The RFP or opportunity documents in this workspace.
3. My own figures \u2014 effort, cost ranges, productivity from my deliveries: [MY FIGURES \u2014 or "none"]
A required input is missing? Ask once, in one line; then write "Not provided \u2014 needs validation" and continue.

RULES
Facts come only from my case documents in this workspace, my Pursuit Ledger and this chat \u2014 no mail, chat, file or web search. Outside code, fictional records and test tasks, start every line or table cell with F [source] (document and section, "Ledger" or "my notes"), A (assumption) or H (hypothesis to validate). Where the sources are silent, write "Not provided \u2014 needs validation". Never decide bid / no-bid, price, margin, staffing or legal terms, and never assess a named person: mark such points "for DCS decision". Anonymised or synthetic material only; if you see a real name or personal data, say so once and continue without it.

STEPS
1. Value narrative: outcome in the client's words \xB7 metric \xB7 baseline (figure, period, source) \xB7 target and date \xB7 measurement (owner, frequency, system, start/stop events) \xB7 attribution (what else moves it, what we control) \xB7 first-90-day leading indicator. Never estimate a baseline or target.
2. Client's commercial rules first: permitted contract forms \xB7 budget or cap \xB7 payment terms \xB7 liability \xB7 service credits \xB7 run-cost statement.
3. Contract-form matrix, a column per permitted form from: T&M (incl. capped) \xB7 fixed price \xB7 managed service \xB7 outcome-based \xB7 hybrid / gain-share; rules silent: all five, headed "permission not stated". Rows: AI effect on effort \xB7 who keeps the AI gain \xB7 risk carried (client, us) \xB7 what must be measured \xB7 preconditions (F/A/H, then met or not today) \xB7 when to choose \xB7 the trap. The outcome sought does not decide how we are paid; T&M is not weaker by default; managed service is a delivery arrangement \u2014 say how it is charged. One line names the excluded forms. Stop and ask: "Which form do you lean towards? Name it, or reply continue for my hypothesis."
4. After my reply \u2014 my form, labelled "my lean (H), for DCS decision with finance"; on "continue", your hypothesis, labelled "hypothesis (H) \u2014 not my lean until I type it". Either way with its parts (build, run, any fee at risk): why it fits \xB7 preconditions met (source) \xB7 open, top three (owner, by when) \xB7 what we must not promise; an excluded form: "not permitted", with source. If my lean, your hypothesis or today's contract is T&M, one more line: the path from T&M to an outcome or gain-share form \u2014 the measure to agree first, the baseline it needs, and the first step.
5. Pricing input pack for finance, structure only, no figure of yours \u2014 five rows: scope basis \xB7 cost drivers (build, integration, human review, exceptions, run support; contingency per Ledger risk) \xB7 AI-productivity assumption (a range, my delivery data only) \xB7 run cost and licences \xB7 milestones, payment and deviations from client terms. A figure is mine, as F [my notes], or "to enter \u2014 DCS / finance". If one of my figures alone exceeds the budget or cap, say so; never add figures up.

OUTPUT
Part 1: (1) and (2) one table each, 7 and 6 rows, 2 columns; (3) the matrix, 7 rows, one column per permitted form; the exclusion line; the question. Part 2: (4) one block, and the T&M path line if it applies; (5) one table, 5 rows, 4 columns: item \xB7 what it must hold \xB7 basis and source \xB7 figure.

HUMAN CHECK \u2014 mine, before the gate
- Baseline, target and each commercial rule match the documents.
- My form is permitted; every open precondition has an owner and a date.
- No price, margin or discount I did not enter.

{{DISCIPLINE}}`,discipline:'Workshop output discipline \u2014 Return only what is requested above. No introduction, no recap, no commentary. Hard limits (source tags and labels not counted): (1) and (2) max 25 words per cell; (3) max 15 words per cell, exclusion line max 30 words; (4) max 120 words, why it fits max 20 of them, the T&M path line max 40 words; (5) max 20 words per cell. If information is missing, write: "Not provided \u2014 needs validation." Do not fill gaps unless labelled as an assumption. Close with one line: "Further detail available on request." Nothing after it. A turn that ends on a question or a request to me ends on that line, without this line. (Remove this block after the workshop to receive the full output.)'},{id:"P2",title:"The CFO",how:['Same chat. Copy, paste, send. Answer each question in your own words; type "stop" to end early.'],text:`From now on you are the CFO from the cast in my Pursuit Ledger \u2014 by role, no real name. You read the value narrative, the contract form and the pricing input pack above before they reach the client. Courteous, numerate, impatient with adjectives. Use only my case documents, my Ledger and this chat; where they are silent, ask as a CFO plausibly would and mark it [simulated].

Ask five questions, one at a time, in this order: value and baseline \xB7 measurement and attribution \xB7 contract form and who keeps the AI gain \xB7 price logic \xB7 run cost. After each of my answers, score it 1\u20135 with two lines: what convinced you, what did not. Do not ask the next question until I answer. A figure I cannot source scores 1\u20132; say why. Never propose a price, discount, margin or figure yourself; if I offer a discount, score it 1 \u2014 pricing is for DCS decision with finance.

After my fifth answer, or when I write stop, leave the role and give: readiness 1\u20135, marked "rehearsed \u2014 not validated" \xB7 the two answers to fix before any client meeting \xB7 up to six items to validate with finance or legal (item \xB7 owner role \xB7 by when, or "Not provided \u2014 needs validation").

: the economics depend on the actual terms."}]},M6:{num:6,stageName:"Define",minutes:45,title:"Solution Definition & Build Package",moment:"the solution must be specified",question:"We know what we sell. Now a team must be able to build it.",intro:`A team must be able to build what you sell \u2014 and a sponsor click it tomorrow. One skill writes the user's journey, scope lines at the client's priority and up to eight stories with tests. Reply "build package" and it writes everything Module 7 needs to build a clickable prototype. One file, saved before the gate.`,steps:[{n:"1",min:"12",do:'Part 1. New chat in your case workspace, "M6 \xB7 Build package": paste the skill, your Ledger under it, send. Check: every client Must still reads Must, or "phase 2 \u2014 client must accept". Ahead of time? Run the quality gate (P2) now.',paste:"P1 \xB7 P2 optional"},{n:"2",min:"10",do:`Part 2. Reply: build package. Read two things: the three screens and the storyline \u2014 would your sponsor follow it? The rest is for tomorrow's builder. Save: the copy button under each answer \u2192 one Word file, "M6 Build Package" \u2014 Part 1, the quality-gate table (P2) if you ran it, Part 2.`,paste:"Reply"},{n:"3",min:"6",do:"Gate. Same chat: paste the gate. Row M6, your first step, the Ledger.",paste:"Gate"}],beforeGate:"Before the gate: three minutes on your page \u2014 the workflow moment (page 2).",good:['No client Must downgraded without "client must accept"',"Every field on a screen is in the eight fictional records","Part 1 and Part 2 saved as one file \u2014 you bring it tomorrow at nine"],stuck:["The model asks which user? One line under your Ledger: the user's role, what they do all day, the one thing they want to stop doing.",'A story has one test instead of three (Copilot)? Type: "Write all three Given / When / Then for S4\u2013S8."',"A record looks like a real person? Fictional alias only; no IDs, addresses or diagnoses \u2014 regenerate."],notATender:"No RFP \u2014 a renewal or a change request? Five lines under your Ledger before you send: the Musts you heard, the user's day, one data rule. The scope lines label what you heard H; ask the sponsor to confirm the Musts before you build on them.",leaveWith:"User journey \xB7 user stories with acceptance criteria \xB7 build package for tomorrow (quality gate if ahead)",page2:{momentHeading:"Workflow moment \u2014 three minutes before the gate",momentQuestion:"How many times is the scope written today \u2014 for the client, the team, the estimate? Where does it drift?",momentRows:["When it starts","What I do \xB7 what AI does","What I check myself","Time it takes"],momentCols:["Today \u2014 how I do this now","From now \u2014 how I want to do it"],firstStepSuggestion:"On my next pursuit, write the scope once as user stories with tests, and send the same text to client and team"},appendixAIntro:["Copy from here \u2014 P1, P2 \u2026 are the pastes named on your module card. Your case workspace, a new chat, the module name as the chat name. Copilot: if the message is too long, send the skill alone \u2014 it asks for your Ledger."],prompts:[{id:"P1",title:"Workflow Skill M6 \u2014 Define the solution and the build package",how:['New chat in your case workspace, "M6 \xB7 Build package". Paste your Ledger under the skill; send. After Part 1, reply: build package. Save both parts as one file \u2014 the copy button under each answer, into one Word file.'],text:`WORKFLOW SKILL M6 \xB7 Define the solution and the build package
Stage 4 of 7 \xB7 Define \xB7 AI-Native DCS Academy
Use when: a team must build the offer and a sponsor click it. Not for: estimates, architecture or staffing.

INPUTS
1. My Pursuit Ledger \u2014 pasted below this skill. Required: if it is missing, ask me for it before anything else.
A required input is missing? Ask once, in one line; then write "Not provided \u2014 needs validation" and continue.

RULES
Facts come only from my case documents in this workspace, my Pursuit Ledger and this chat \u2014 no mail, chat, file or web search. Outside code, fictional records and test tasks, start every line or table cell with F [source] (document and section, "Ledger" or "my notes"), A (assumption) or H (hypothesis to validate). Where the sources are silent, write "Not provided \u2014 needs validation". Never decide bid / no-bid, price, margin, staffing or legal terms, and never assess a named person: mark such points "for DCS decision". Anonymised or synthetic material only; if you see a real name or personal data, say so once and continue without it.

STEPS
1. Journey of the primary user \u2014 my cast, or my M2 persona pasted under my Ledger \u2014 6 steps: trigger, action and systems today \xB7 pain, in the user's words where sourced \xB7 tomorrow: what changes, what the human decides.
2. Scope lines: every client requirement at the client's priority (none written? the one I heard, marked H) \u2014 a Must stays Must or reads "phase 2 \u2014 client must accept" \u2014 plus lines for adoption, governance, licences or run cost. Per line: phase 1 yes / no \xB7 prototype screen or "not shown".
3. Up to 8 stories, S1\u2013S8, for phase 1, at each requirement's client priority: As a / I need / so that \xB7 three Given / When / Then, never merged \xB7 one exception \xB7 what the human confirms (nothing automated about a person) \xB7 requirement ID.
4. Part 2, after I reply build package. If the quality gate ran in this chat, open Part 2 with one line per changed story or scope line ("S2 \u2014 now: \u2026"), then apply the changes throughout: NFRs from the sources: performance, availability, data, audit, accessibility, integration, AI limits \xB7 hypothesis: if the user can do X, the Ledger metric moves, for a sourced reason \xB7 scope lock, exactly 3 screens: stories, the one click, what is out \xB7 8 fictional records, every field the screens show, as at demo start \xB7 storyline, 5 steps, in the order and values the rules compute.
5. Master build prompt: one HTML file, inline CSS and plain JavaScript, no libraries or external calls, under 400 lines, one code block \xB7 3 screens, 8 records \xB7 demo user and role \xB7 reference time \xB7 rule per computed field \xB7 which record stays unresolved \xB7 banner "Workshop demonstrator \u2014 synthetic data \u2014 not production" \xB7 per AI suggestion a reason line, Confirm / Change / Reject, "Suggestion \u2014 a human decides" \xB7 audit log: user, role, time, action \xB7 "Mock" on simulated integrations \xB7 no backend, sign-in or real data. Scope lock, records, storyline, master prompt: no F/A/H. Then readiness: what tomorrow's build can rely on, and what is open (owner, date from my Ledger, else "date Not provided \u2014 needs validation").

OUTPUT
Part 1: (1) journey, 6 rows, 4 columns; (2) scope lines, max 15 rows, 5 columns; (3) stories. Part 2: (4) NFRs, max 7 rows, 2 columns; (5) hypothesis; (6) scope lock, 3 rows, 4 columns; (7) data pack, 8 rows, max 8 columns; (8) storyline; (9) master prompt; (10) readiness, max 5 lines. Part 1 ends on "Reply build package for Part 2.", nothing after it; Part 2 ends, before the closing line, "Next stage needs \u2014 for M7 and M11: my M6 Build Package file."

HUMAN CHECK \u2014 mine, before the gate
- No client Must downgraded without "client must accept".
- Every screen field is in the data pack; records fictional; storyline follows the rules.
- Master prompt: banner, reason line, Confirm / Change / Reject, log, mock labels; Parts 1 and 2 saved as one file.

Then two checks, each "yes" or "no" with the evidence: (a) every client Must keeps its priority or reads "client must accept"; (b) no story lets the tool decide anything about a customer, citizen, member, patient or employee.

Do not rewrite the stories; Part 2 applies the changes when I reply build package.

{{DISCIPLINE}}`,discipline:'Workshop output discipline \u2014 Return only what is requested above. No introduction, no recap, no commentary. Hard limits (source tags and labels not counted): (1) one line per check, max 20 words each; (2) one table, one row, 7 columns, max 15 words per cell; (3) the eight field names in bold, "\u2014" for an empty field; fields 1\u20133 in full as above; fields 4\u20137 max 350 words together; field 8 word for word. If information is missing, write: "Not provided \u2014 needs validation." Do not fill gaps unless labelled as an assumption. Close with one line: "Further detail available on request." Nothing after it. A turn that ends on a question or a request to me ends on that line, without this line. (Remove this block after the workshop to receive the full output.)'}],appendixB:[{title:"NO REQUIREMENTS OR USER'S DAY IN YOUR WORKSPACE",body:`No requirements or user's day in your workspace? Before you send, add five lines under your Ledger: the Musts you heard, the user's day \u2014 trigger, what they do, the tools they open, what they complain about \u2014 and one data or AI rule. The model maps only what you give it; every "Not provided" cell is a question for your next site visit.`},{title:"WHICH USER",body:"The skill designs for the primary user in your cast (Module 2). Want the richer M2 persona? Copy it from your M2 chat and paste it under your Ledger \u2014 optional. No cast at all? Add one line under your Ledger instead: the user's role, what they do all day, the one thing they want to stop doing."},{title:"THE DEFAULT PATH, AND THE QUALITY GATE",body:"The default path: Part 1, reply build package, save Part 1 and Part 2 as one file, gate. The governance points are built into the master prompt either way. Ahead of time? Run the quality gate (P2) before you reply build package: three reviewers from your cast, and Part 2 applies their changes."},{title:"YOUR TOOL",body:'Copilot without a case agent, in your case chat: attach your Case Pack (and any file the card names) and start with "Use only the attached file." A private chat gets only what your card says. Everything else \u2014 workspace, private chat, preview, reusable skill \u2014 is on the tool card: Appendix B of your M0 guide, and the Workflow Skills Library.'}]},M7:{num:7,stageName:"Build",minutes:50,title:"Prototype Sprint",moment:"the build package is ready",question:"The build package is ready. Let's click it.",intro:"Show the working day, not a slide about it. One skill turns your build package into a clickable prototype \u2014 one HTML file, synthetic data, a human deciding every suggestion. Look at it in your tool's preview; save it to keep it. Then a six-point review, one change, and Demo Notes that say what it does not prove.",steps:[{n:"1",min:"16",do:`Build. New chat in your case workspace, "M7 \xB7 Prototype": paste the skill and your Ledger; attach your M6 Build Package file; send. Open the tool's preview \u2014 or save as .html and double-click. Click your storyline; save as [case]_v1.html.`,paste:"P1"},{n:"2",min:"10",do:'Review and one change. Same chat: the six-point review. Then "Change exactly one thing" with the first fix; save as [case]_v2.html. Six Pass? No change \u2014 _v1 is your file. Paste the Demo Notes at the end of your Build Package file; read "does not prove" aloud, 30 seconds.',paste:"P2 \xB7 P3"},{n:"3",min:"6",do:"Gate. Same chat: paste the gate. Row M7, your first step, the Ledger.",paste:"Gate"}],beforeGate:"Before the gate: three minutes on your page \u2014 the workflow moment (page 2).",good:["The banner on every screen; every suggestion waits for Confirm, Change or Reject","You clicked the whole storyline \u2014 no dead step","Demo Notes say what it does not prove: integration, accuracy, scale, outcome"],stuck:["No preview in your tool? Copy the code into Notepad or TextEdit, save as .html (All files, UTF-8), double-click. That always works. Gemini: select Canvas before you send P1.","Code stops before </html>, or a blank page? Use the cut-off line in Appendix B.","The skill asks for your build package and builds nothing? Copy Part 1 and Part 2 from your M6 chat into one document, attach it, send again."],notATender:"No tender behind your case? Nothing changes: the prototype shows your decision-maker the working day your proposal, renewal or change promises. Use the storyline as your opening five minutes with them \u2014 for a proposal, a renewal or a change.",leaveWith:"A clickable prototype of your own case \xB7 six-point review \xB7 Demo Notes",page2:{momentHeading:"Workflow moment \u2014 three minutes before the gate",momentQuestion:"How is a demo built today \u2014 by whom, how long, from what? What would your sponsor click first?",momentRows:["When it starts","What I do \xB7 what AI does","What I check myself","Time it takes"],momentCols:["Today \u2014 how I do this now","From now \u2014 how I want to do it"],firstStepSuggestion:"Before my next sponsor meeting on ______, build a three-screen click-through from a build package"},appendixAIntro:["Copy from here \u2014 P1, P2 \u2026 are the pastes named on your module card. Your case workspace, a new chat, the module name as the chat name. Copilot: if the message is too long, send the skill alone \u2014 it asks for your Ledger."],prompts:[{id:"P1",title:"Workflow Skill M7 \u2014 Build the clickable prototype",how:['New chat in your case workspace, "M7 \xB7 Prototype". Paste the skill, your Ledger under it; attach your M6 Build Package file (or paste it under the Ledger). Send.'],text:`WORKFLOW SKILL M7 \xB7 Build the clickable prototype
Stage 5 of 7 \xB7 Build \xB7 AI-Native DCS Academy
Use when: a build package is ready and a sponsor, evaluator or team must see the working day. Not for: production code, real data, integrations or effort estimates.

INPUTS
1. My Pursuit Ledger \u2014 pasted below this skill. Required: if it is missing, ask me for it before anything else.
2. My M6 Build Package file, Part 1 and Part 2 as saved \u2014 attached, or pasted below my Ledger. Required: without it, ask me for it once and build nothing.
A required input is missing? Ask once, in one line; then write "Not provided \u2014 needs validation" and continue.

RULES
Facts come only from my case documents in this workspace, my Pursuit Ledger and this chat \u2014 no mail, chat, file or web search. Outside code, fictional records and test tasks, start every line or table cell with F [source] (document and section, "Ledger" or "my notes"), A (assumption) or H (hypothesis to validate). Where the sources are silent, write "Not provided \u2014 needs validation". Never decide bid / no-bid, price, margin, staffing or legal terms, and never assess a named person: mark such points "for DCS decision". Anonymised or synthetic material only; if you see a real name or personal data, say so once and continue without it.

STEPS
1. Read the build package as the specification: its master build prompt says what to build; its scope lock names the only screens; its synthetic records are the only data, as at demo start; its storyline must be clickable from that start, in order; its reference time sets every date and deadline, never the computer clock. Part 1, hypothesis and readiness guide you; they stay off screen.
2. Before the code, at most three lines: a missing part, two parts that contradict, or a storyline step acting on a record already shown as done (start that record as pending). A storyline step the rules contradict: build as the rules compute, and head that line "Next stage needs \u2014 for M11: storyline step [n] \u2014 [as built]". Then build what the package allows; do not stop to ask about gaps.
3. Build one HTML file: inline CSS and plain JavaScript, no libraries, no external calls, no backend, no sign-in, no alert(), confirm() or prompt() \u2014 every message shows on the page; under 400 lines. On every screen the banner "Workshop demonstrator \u2014 synthetic data \u2014 not production". On every suggestion: its reason in one line, the label "Suggestion \u2014 a human decides", and Confirm, Change and Reject \u2014 nothing applied automatically; each click shows its result on the screen where it was made. Every decision adds an audit-log line with role and time. Anything a live system would supply is marked "mock".
4. A value the screens need but the package lacks: show "Not provided \u2014 needs validation" or a neutral value marked "synthetic". Never write client content, invent records or score a person. F/A/H labels go in your lines outside the code, not on screen.
5. Self-check: banner on every screen; only the scoped screens and records; every storyline step and every Confirm, Change and Reject works where clicked; no browser pop-up; the file ends with </html>.

OUTPUT
(1) The gap lines, or "Package complete". (2) The complete HTML file in one code block, from <!DOCTYPE html> to </html>. (3) The storyline to click: one numbered line per step, naming the screen.

HUMAN CHECK \u2014 mine, before the gate
- Saved as [case]_v1.html, it opens in my browser with no internet connection.
- I clicked every storyline step; every suggestion waited for my click and left a log line.
- Every record and figure on screen comes from my synthetic data \u2014 nothing real, nothing invented.

{{DISCIPLINE}}`,discipline:'Workshop output discipline \u2014 Return only what is requested above. No introduction, no recap, no commentary. Hard limits (source tags and labels not counted): (1) max 3 lines, max 25 words each; (2) one complete file, max 400 lines, never cut short \u2014 if it runs long, simplify the styling, never the screens or the controls; (3) max 6 lines, max 20 words each, source tag included. If information is missing, write: "Not provided \u2014 needs validation." Do not fill gaps unless labelled as an assumption. Close with one line: "Further detail available on request." Nothing after it. A turn that ends on a question or a request to me ends on that line, without this line. (Remove this block after the workshop to receive the full output.)'},{id:"P2",title:"The six-point review",how:["Same chat. Copy, paste, send."],text:`Act as a sceptical reviewer of my prototype \u2014 the latest complete HTML code in this chat, or the file attached to this message. Check it against my build package in this chat on six points:
1 Banner \u2014 "Workshop demonstrator \u2014 synthetic data \u2014 not production" on every screen.
2 Scope \u2014 only the screens of the scope lock; no screen, feature or record added.
3 A human decides \u2014 every suggestion carries "Suggestion \u2014 a human decides" and waits for Confirm, Change or Reject; nothing applied automatically; no person scored or ranked.
4 Traceable \u2014 every suggestion shows its reason before Confirm; every decision adds an audit-log line with role and time.
5 Honest \u2014 only the records of the data pack; nothing invented; "mock" on anything a live system would supply; no claimed integration, accuracy rate, outcome figure or reference.
6 Walkable \u2014 the storyline can be clicked step by step, in order, from the start state; every Confirm, Change and Reject, on every screen, shows a visible result where it was clicked.

For each point: Pass or Fail \xB7 the evidence, starting F [screen] \xB7 if Fail, the fix as one sentence I can paste into "Change exactly one thing". Then rank the fixes, at most three, governance points (1, 3, 4, 5) first.

Then Demo Notes v1, for this version with the first fix applied: What it demonstrates (three lines \u2014 what a sponsor sees and may conclude) \xB7 What it does not prove (three lines \u2014 integration, accuracy, scale, outcome, build effort) \xB7 What to validate next (three lines, each with an owner role).

{{DISCIPLINE}}`,discipline:'Workshop output discipline \u2014 Return only what is requested above. No introduction, no recap, no commentary. Hard limits (source tags and labels not counted): one table, 6 rows, 4 columns (point \xB7 verdict \xB7 evidence \xB7 fix), max 25 words per cell; max 3 ranked fix lines, max 20 words each; Demo Notes: three blocks of exactly three lines, max 20 words per line. If information is missing, write: "Not provided \u2014 needs validation." Do not fill gaps unless labelled as an assumption. Close with one line: "Further detail available on request." Nothing after it. A turn that ends on a question or a request to me ends on that line, without this line. (Remove this block after the workshop to receive the full output.)'},{id:"P3",title:"Change exactly one thing",how:["Same chat. Replace [CHANGE] with the review's first-ranked fix \u2014 one sentence. Send; save the new file as [case]_v2.html."],text:`Change exactly one thing in the prototype: [CHANGE \u2014 one sentence, e.g. the first-ranked fix from the review]. If it asks for two different changes, apply only the first. Keep everything else identical \u2014 the same screens, records, banner, suggestions, confirm steps and log. Add no feature, screen, record or styling. Return the complete updated HTML file in one code block.

{{DISCIPLINE}}`,discipline:'Workshop output discipline \u2014 Return only what is requested above. No introduction, no recap, no commentary. Hard limits (source tags and labels not counted): the complete file, max 400 lines, never cut short; then one line, max 20 words, stating what changed and anything not applied. If information is missing, write: "Not provided \u2014 needs validation." Do not fill gaps unless labelled as an assumption. Close with one line: "Further detail available on request." Nothing after it. A turn that ends on a question or a request to me ends on that line, without this line. (Remove this block after the workshop to receive the full output.)'},{id:"GATE",title:"The gate \u2014 closes every module",how:['Same chat. Type your decision line first if you took one ("Decision: \u2026", with an owner and a date for each condition). Past case? Type "Case date: \u2026" too. Then paste, send.'],text:`GATE \u2014 close this module. Use only this chat and my last Pursuit Ledger.
(1) The human checks of the Workflow Skill I ran: for each, "shown", "missing" or "mine to confirm", with the evidence in this chat in one line.
(2) My workflow row: a one-row table with the columns Stage \xB7 Module \xB7 Trigger (when I will run this) \xB7 Input \xB7 Workflow Skill \xB7 Human check \xB7 Output.
(3) My updated Pursuit Ledger with exactly these eight fields: 1 Case (client alias \xB7 sector \xB7 what is being bought \xB7 my role \u2014 one line) \xB7 2 Cast (one line per role \u2014 alias \xB7 what they want \xB7 what they will test us on: decision-maker (with H1\u2013H3 in full) \xB7 CFO \xB7 lead evaluator \xB7 delivery lead (ours) \xB7 primary user \xB7 data protection or risk) \xB7 3 One truth (bid decision and its conditions in full, with owners and dates \u2014 later reopen and bid-board conditions included (or the no-bid as recorded) \xB7 phase-1 scope (story IDs with the client's priority) \xB7 budget or cap, and what it includes \xB7 outcome metric with baseline and target, by when \xB7 key dates \xB7 contract form with its parts and its label (decision or H) \xB7 key roles \xB7 latest assessed score per criterion (1\u20135, with its module \u2014 blind re-scores beside it, never instead) \xB7 win themes (titles)) \xB7 4 Stage reached (module and date) \xB7 5 Decisions I took (numbered, each with its module and its conditions in full \u2014 where One truth already states what was decided (the bid conditions included), a short name and the module are enough) \xB7 6 Artefacts (name \xB7 where it lives (chat or file)) \xB7 7 Open \u2014 to validate (what \xB7 with whom \xB7 by when) \xB7 8 Next stage needs (word for word, every line a skill headed "Next stage needs \u2014 for Mx", kept until module x has run; otherwise one line).
Fields 1\u20133 are the fixed block: copy them word for word from my last Ledger and change only what this module changed, marking each change with this module, e.g. "(M8)". Never shorten the cast lines, H1\u2013H3, the bid conditions, the cap and what it includes, commercial figures, the contract form, the scores or the win themes; anything this module adds to fields 1\u20133 for the first time, copy word for word from this chat. Fields 4\u20138 roll: carry every decision with its conditions and every open item forward unless this module closed it (a decision whose content One truth already states needs only a short name and its module); copy word for word any lines a skill headed "Next stage needs \u2014 for Mx" and keep each until module x has run. Labels stay as they are ("H", "to confirm", "practice card"). Record as a decision only what I typed as a decision; everything else stays "Open". A rehearsal or simulation result is "rehearsed \u2014 not validated", never a client fact or an approval. Any condition in One truth whose date is on or before the date I typed (else today) is "met" only if this chat shows it; otherwise add to Open "missed \u2014 reopen qualification (renewal or change request: reopen that decision), for DCS decision". If the Ledger runs long, shorten Artefacts first and list under Open anything you removed; then merge Open items that share an owner, each part keeping its own date, and cut each item to what \xB7 with whom \xB7 by when \u2014 never drop one.

{{DISCIPLINE}}`,discipline:'Workshop output discipline \u2014 Return only what is requested above. No introduction, no recap, no commentary. Hard limits (source tags and labels not counted): (1) one line per check, max 20 words each; (2) one table, one row, 7 columns, max 15 words per cell; (3) the eight field names in bold, "\u2014" for an empty field; fields 1\u20133 in full as above; fields 4\u20137 max 350 words together; field 8 word for word. If information is missing, write: "Not provided \u2014 needs validation." Do not fill gaps unless labelled as an assumption. Close with one line: "Further detail available on request." Nothing after it. A turn that ends on a question or a request to me ends on that line, without this line. (Remove this block after the workshop to receive the full output.)'}],appendixB:[{title:"SAVE AND OPEN THE FILE",body:'1. Click the copy button on the code block \u2014 or select everything from <!DOCTYPE html> to </html>. 2. Paste into Notepad (Windows) or TextEdit (Mac: Format \u2192 Make Plain Text first). 3. Save as [your case]_v1.html \u2014 file type "All files", encoding UTF-8. 4. Double-click the file. It opens in your browser, with no internet needed. 5. Click your storyline, step by step, before you change anything.'},{title:"THE CODE IS CUT OFF, OR THE PAGE IS BLANK",body:'Code stops before </html>, or the page opens blank? Send: "Your file stopped before </html>. Return the complete file again in under 15,000 characters: plainer styling, the same screens, records and controls." Copilot cuts long answers off; the limits in the skill are there for this reason. Copilot opened a Page? Ask for the full code in one code block in the chat.'},{title:"NO BUILD PACKAGE FILE",body:'No build package file? Open your M6 chat, copy Part 1 and Part 2 \u2014 as written \u2014 into one document, save it as "M6 Build Package" and attach it. Lost Part 2? Reply build package again in that chat. The M7 skill builds only from the package; without it, it asks once and stops.'},{title:"PREVIEW IN YOUR TOOL",body:"ChatGPT: open the code in Canvas, then Preview. Gemini: select Canvas in the prompt bar before you send P1, then the Preview tab; code already in the chat? Save it as .html. Copilot: ask for the code in one code block and save it \u2014 Pages is optional. A preview is a quick look; the saved file is what you keep, show and bring to Module 11."},{title:"YOUR TOOL",body:'Copilot without a case agent, in your case chat: attach your Case Pack (and any file the card names) and start with "Use only the attached file." A private chat gets only what your card says. Everything else \u2014 workspace, private chat, preview, reusable skill \u2014 is on the tool card: Appendix B of your M0 guide, and the Workflow Skills Library.'}]},M8:{num:8,stageName:"Build",minutes:50,title:"Landing a Change",moment:"Procurement Addendum No. 1 arrives",question:"One week later, the client changes the rules.",intro:"One week after the work is done, the client changes the rules. One skill lands the change on your case, maps what it hits and stops for your decisions; it then applies only those \u2014 before \u2192 after \u2014 and writes the pack the panel will read. A hold test shows what survived.",steps:[{n:"1",min:"11",do:`Land and map. Pick one card (slide 2, or Appendix B) \u2014 Card 0 for your client's real change. New chat in your case workspace, "M8 \xB7 Landing a Change": paste the skill with your card in [CARD] \u2014 the new figure or date typed by you, e.g. "1 \xB7 cap \u20AC1.44 M (\u221220%)" \u2014 your Ledger under it. Read the map; write one decision line per row. A reopen line? One more line: keep, add a condition (owner, date) or stop.`,paste:"P1"},{n:"2",min:"9",do:'Apply. Send your decision lines. Check every delta against them; a client Must moved reads "partially comply \u2014 moved".',paste:"\u2014"},{n:"3",min:"12",do:"Hold, then gate. Live tender: the blind re-score in a private chat first. Then the hold test in the M8 chat; put back any silent drop. Then the gate.",paste:"P2 \xB7 P3 \xB7 Gate"}],beforeGate:"Before the gate: three minutes on your page \u2014 the workflow moment (page 2).",good:['Practice lines tagged "(practice card N)"; Card 0 reads like your client',"Every delta traces to one of your decision lines \u2014 nothing else moved",'The hold test says "holds" only with a source, and gives an outcome'],stuck:["The change reads generic? Paste the lines it touches \u2014 your M6 stories, your M4 fragment \u2014 under your Ledger and run it again.",'You typed "you decide"? It recommends, marked for DCS decision, and waits: now write your own line per row.',"A price in an option? Out \u2014 options are moves, not numbers; finance prices them."],notATender:"No tender? The skill writes the change as a change request or steering decision, and the evaluator pack uses the criteria your decision-maker will judge on \u2014 from your case documents, or labelled H. The blind re-score is for live tenders; skip it.",leaveWith:"One change from the menu, landed on your case \xB7 impact map \xB7 your decisions \xB7 a quality-hold test (blind re-score: live tenders)",page2:{momentHeading:"Workflow moment \u2014 three minutes before the gate",momentQuestion:"When a client changes the rules today, how long until you know what it hits? Who decides what moves?",momentRows:["When it starts","What I do \xB7 what AI does","What I check myself","Time it takes"],momentCols:["Today \u2014 how I do this now","From now \u2014 how I want to do it"],firstStepSuggestion:"On the next client change, run the impact map before anyone answers it \u2014 by ______"},appendixAIntro:["Copy from here \u2014 P1, P2 \u2026 are the pastes named on your module card. Your case workspace, a new chat, the module name as the chat name. Copilot: if the message is too long, send the skill alone \u2014 it asks for your Ledger."],prompts:[{id:"P1",title:"Workflow Skill M8 \u2014 Land a change",how:[`New chat in your case workspace, "M8 \xB7 Landing a Change". Replace [CARD] with your card and the new figure or date you worked out yourself, e.g. "1 \xB7 cap \u20AC1.44 M (\u221220%)", or "0" with your client's text under your Ledger. Send. After the map, one message: "a: \u2026 b: \u2026 c: \u2026 d: \u2026 e: \u2026 f: \u2026" \u2014 letter, option, why \u2014 plus "Reopen: keep / add a condition (owner, date) / stop" if it wrote a reopen line.`],text:`WORKFLOW SKILL M8 \xB7 Land a change
Stage 5 of 7 \xB7 Build \xB7 AI-Native DCS Academy
Use when: the rules change after the work is done. Not for: choosing my response.

INPUTS
1. My Pursuit Ledger \u2014 pasted below this skill. Required: if it is missing, ask me for it before anything else.
2. My card: [CARD \u2014 e.g. "1 \xB7 cap \u20AC1.44 M (\u221220%)", or "0" with my client's change under my Ledger]. 1 budget cap \xB7 2 earlier date \xB7 3 AI or data rule \xB7 4 new decision-maker \xB7 5 contract form \xB7 6 price pressure \xB7 7 more volume or scope \xB7 8 key capability unavailable.
3. Optional, under my Ledger: the lines it touches (M6 stories, M4 fragment).
A required input is missing? Ask once, in one line; then write "Not provided \u2014 needs validation" and continue.

RULES
Facts come only from my case documents in this workspace, my Pursuit Ledger and this chat \u2014 no mail, chat, file or web search. Outside code, fictional records and test tasks, start every line or table cell with F [source] (document and section, "Ledger" or "my notes"), A (assumption) or H (hypothesis to validate). Where the sources are silent, write "Not provided \u2014 needs validation". Never decide bid / no-bid, price, margin, staffing or legal terms, and never assess a named person: mark such points "for DCS decision". Anonymised or synthetic material only; if you see a real name or personal data, say so once and continue without it.

STEPS
1. Land the card. Client text pasted or attached: summarise my card's part (card 0: all), tagged. Cards 1\u20138 are practice, never client information: write it as issued (tender: addendum; renewal: benchmark or steering note; else change request; card 8: our staffing note) in my client's scope, users, metric, channel, issuer by role, each line "A (practice card N)". Use the figure or date I typed with my card; none typed: "Not provided \u2014 needs validation". No other figure, date or name.
2. Impact map, a row per earlier output: (a) requirements, compliance, scores \xB7 (b) value and metric \xB7 (c) contract form, preconditions \xB7 (d) phase-1 stories and scope \xB7 (e) prototype \u2014 notes for M11, build nothing \xB7 (f) cast and win themes. Columns: output \xB7 changes \xB7 stays \xB7 decision forced \u2014 2\u20133 options, owner by role, by when; no price in any option. My bid, renewal or change-request decision, or one of its conditions, undermined: "Reopen [that decision] \u2014 [why], for DCS decision". End with "Your decisions \u2014 one line per row: letter, option, why. I apply only these." and stop. Asked to choose: recommend one per row, for DCS decision; stop again.
3. When I reply, apply only my decisions as deltas, before \u2192 after, practice ones tagged "(practice card N)". A scope split follows my client's priorities, Musts first, licences or run cost under a cap included; human confirmation of AI, audit logging and data rules stay in phase 1; a client Must moved to phase 2 is declared "partially comply \u2014 moved per [the change]", never hidden. Then decision (e), word for word, headed "Next stage needs \u2014 for M11:". Card 7: each changed requirement with its acceptance check; cost drivers for the new scenario. Card 8: covered only with evidence and a credible date \u2014 enrolment is not competence; then the open readiness question, headed "Next stage needs \u2014 for M9:".
4. A block headed EVALUATOR PACK: the change as my client wrote it (card 8: none) \xB7 published criteria and weights (no tender: what my decision-maker judges on, F or H) \xB7 our revised response, in my client's words \u2014 nothing internal.

OUTPUT
Answer 1: (1) the change \u2014 a header line, max 6 numbered items; (2) impact map \u2014 one table, rows (a)\u2013(f), 4 columns; any reopen line. Answer 2: (3) deltas \u2014 one table, max 8 rows: output \xB7 before \xB7 after; the hand-off lines; (4) the EVALUATOR PACK.

HUMAN CHECK \u2014 mine, before the gate
- The change reads like my client; practice tagged.
- Every delta traces to my decision; nothing else moved.
- No client Must, control or data rule moved undeclared.

{{DISCIPLINE}}`,discipline:`Workshop output discipline \u2014 Return only what is requested above. No introduction, no recap, no commentary. Hard limits (source tags and labels not counted): (1) max 140 words; (2) max 25 words per cell or line; (3) max 20 words per cell; (4) max 250 words besides the quoted change; untagged, except F or H on the decision-maker's criteria. If information is missing, write: "Not provided \u2014 needs validation." Do not fill gaps unless labelled as an assumption. Close with one line: "Further detail available on request." Nothing after it. A turn that ends on a question or a request to me ends on that line, without this line. (Remove this block after the workshop to receive the full output.)`},{id:"P2",title:"Live tender only \u2014 the blind re-score, a private chat",how:["Private chat, never your workspace. Replace [PASTE THE EVALUATOR PACK HERE] with the EVALUATOR PACK from your M8 chat. Copy the score table back for P3."],text:`Act as one of the client's evaluators. Use only the evaluator pack below \u2014 no other chat, file, mail or web. You read forty pages in forty minutes: you reward specific, evidenced answers to the criterion wording and mark down generic claims and anything not shown on the page.

(1) Score each criterion in the pack 0\u20135 from this page alone, with the margin sentence you would write. (2) Quote the sentence that shows the response complies with the change, or write "Not shown". (3) Three places where a competitor's response would look stronger, and why.

[PASTE THE EVALUATOR PACK HERE]

{{DISCIPLINE}}`,discipline:'Workshop output discipline \u2014 Return only what is requested above. No introduction, no recap, no commentary. Hard limits (source tags and labels not counted): (1) one table, one row per criterion (max 9), 3 columns (criterion \xB7 score 0\u20135 \xB7 margin sentence), max 20 words per cell; (2) one line, max 40 words; (3) exactly three bullets, max 20 words each. If information is missing, write: "Not provided \u2014 needs validation." Do not fill gaps unless labelled as an assumption. Close with one line: "Further detail available on request." Nothing after it. A turn that ends on a question or a request to me ends on that line, without this line. (Remove this block after the workshop to receive the full output.)'},{id:"P3",title:"The hold test",how:['Back in the M8 chat. Replace [BLIND SCORES] with the table from P2, or "not run". Send. Silent drops? Send the put-back line it wrote. Put-back sent? Read the new pack; no second blind run.'],text:`Act as a sceptical quality reviewer of this pursuit. Before = my Pursuit Ledger at the top of this chat; after = the change, my decisions and the deltas above. The blind evaluator's scores from a private chat: [BLIND SCORES \u2014 paste the table, or "not run"]
Quality holds when my client's mandatory requirements, the integrity of our evidence and the agreed minimum quality survive. Scope, dates, targets and scores may change if the trade-off is visible and decided.

(1) Hold test, one row per invariant: 1 Compliance and score \u2014 every client Must delivered or declared; top-weighted criteria score no lower, or each drop is named and accepted \xB7 2 Value line \u2014 metric, baseline and first proof still connect to phase-1 scope; the outcome metric's population matches the phase-1 sites; any change to target or date stated openly \xB7 3 Controls \u2014 human confirmation of AI, audit logging and data rules intact \xB7 4 Commercial preconditions \u2014 the contract form's preconditions still hold; any risk that moved has an owner \xB7 5 Deliverability \u2014 key roles, skills and dependencies credible for the date \xB7 6 One truth \u2014 scope, budget, metric and date read the same in every output. For each: before \xB7 after \xB7 verdict (holds, at risk or broken) \xB7 fix and owner by role. "Holds" needs a source tag; without one, it is "at risk". Blind scores (0\u20135) sit beside the assessed scores in my Ledger, never replace them.
(2) Silent drops: anything a "before" cell holds that its "after" cell leaves out, or a client Must the evaluator pack no longer covers, with no decision of mine \u2014 one line each, then the line I can send: "Put back: [items]. Return the EVALUATOR PACK again." Or "No silent drops found".
(3) Review required: each earlier output the deltas put out of step (M4 fragment, value narrative, stories, prototype, Demo Notes) \u2014 "review required \u2014 [what]", or "None found".
(4) Outcome, one line: suitable for the next step \xB7 conditional (what, owner, date) \xB7 stop / rework. A critical client Must neither delivered nor moved as the client allows is stop / rework, never conditional.
No new figures, no prices.

(3) My updated Pursuit Ledger with exactly these eight fields: 1 Case (client alias \xB7 sector \xB7 what is being bought \xB7 my role \u2014 one line) \xB7 2 Cast (one line per role \u2014 alias \xB7 what they want \xB7 what they will test us on: decision-maker (with H1\u2013H3 in full) \xB7 CFO \xB7 lead evaluator \xB7 delivery lead (ours) \xB7 primary user \xB7 data protection or risk) \xB7 3 One truth (bid decision and its conditions in full, with owners and dates \u2014 later reopen and bid-board conditions included (or the no-bid as recorded) \xB7 phase-1 scope (story IDs with the client's priority) \xB7 budget or cap, and what it includes \xB7 outcome metric with baseline and target, by when \xB7 key dates \xB7 contract form with its parts and its label (decision or H) \xB7 key roles \xB7 latest assessed score per criterion (1\u20135, with its module \u2014 blind re-scores beside it, never instead) \xB7 win themes (titles)) \xB7 4 Stage reached (module and date) \xB7 5 Decisions I took (numbered, each with its module and its conditions in full \u2014 where One truth already states what was decided (the bid conditions included), a short name and the module are enough) \xB7 6 Artefacts (name \xB7 where it lives (chat or file)) \xB7 7 Open \u2014 to validate (what \xB7 with whom \xB7 by when) \xB7 8 Next stage needs (word for word, every line a skill headed "Next stage needs \u2014 for Mx", kept until module x has run; otherwise one line).
Fields 1\u20133 are the fixed block: copy them word for word from my last Ledger and change only what this module changed, marking each change with this module, e.g. "(M8)". Never shorten the cast lines, H1\u2013H3, the bid conditions, the cap and what it includes, commercial figures, the contract form, the scores or the win themes; anything this module adds to fields 1\u20133 for the first time, copy word for word from this chat. Fields 4\u20138 roll: carry every decision with its conditions and every open item forward unless this module closed it (a decision whose content One truth already states needs only a short name and its module); copy word for word any lines a skill headed "Next stage needs \u2014 for Mx" and keep each until module x has run. Labels stay as they are ("H", "to confirm", "practice card"). Record as a decision only what I typed as a decision; everything else stays "Open". A rehearsal or simulation result is "rehearsed \u2014 not validated", never a client fact or an approval. Any condition in One truth whose date is on or before the date I typed (else today) is "met" only if this chat shows it; otherwise add to Open "missed \u2014 reopen qualification (renewal or change request: reopen that decision), for DCS decision". If the Ledger runs long, shorten Artefacts first and list under Open anything you removed; then merge Open items that share an owner, each part keeping its own date, and cut each item to what \xB7 with whom \xB7 by when \u2014 never drop one.

{{DISCIPLINE}}`,discipline:'Workshop output discipline \u2014 Return only what is requested above. No introduction, no recap, no commentary. Hard limits (source tags and labels not counted): (1) one line per check, max 20 words each; (2) one table, one row, 7 columns, max 15 words per cell; (3) the eight field names in bold, "\u2014" for an empty field; fields 1\u20133 in full as above; fields 4\u20137 max 350 words together; field 8 word for word. If information is missing, write: "Not provided \u2014 needs validation." Do not fill gaps unless labelled as an assumption. Close with one line: "Further detail available on request." Nothing after it. A turn that ends on a question or a request to me ends on that line, without this line. (Remove this block after the workshop to receive the full output.)'}],appendixB:[{title:"PRACTICE CARDS",body:'Cards 1\u20138 are practice: an exercise assumption, never client information. Every line they drive is tagged "(practice card N)", in the chat and in your Ledger, and stays tagged for the rest of the Academy \u2014 Modules 9\u201313 work on the changed case, and nothing practised is ever read as client fact. No keep-or-undo line needed.'},{title:"CARD 0 \u2014 YOUR CLIENT'S REAL CHANGE",body:"Your client has really changed something? Use Card 0: paste their text (anonymised) under your Ledger, and the lines it touches if you have them. The skill summarises it with its tags instead of writing one. Card 0 is client information."},{title:"THIN LEDGER",body:'Thin Ledger \u2014 many fields "Open"? The impact map still has six rows; where the Ledger is silent the cell reads "Not provided \u2014 needs validation". Paste the lines the card touches (your M6 stories, your M4 fragment) under the Ledger and the map gets specific.'},{title:"CARD 7 AND CARD 8",body:`Card 7 \u2014 more volume or a broader scope: every changed requirement keeps its acceptance check, and the deltas restate the cost drivers for the new scenario \u2014 volumes, users, sites, licences \u2014 as drivers for finance, never a price. Card 8 \u2014 a key role or skill you cannot field by the start \u2014 is our change, not the client's: it lands as our own staffing note, and the evaluator pack shows only the revised response. A gap counts as covered only with evidence and a credible date; a course booking is not competence. The open readiness question goes to Module 9 in a line headed "Next stage needs \u2014 for M9".`},{title:"A BUDGET RANGE",body:'Type the new figure or date yourself \u2014 the model never computes it. A budget range, e.g. \u20AC1.2\u20131.8 million? Apply the card to its upper end: \u221220% on \u20AC1.8 million is a \u20AC1.44 million cap, so [CARD] reads "1 \xB7 cap \u20AC1.44 M (\u221220%)".'},{title:"YOUR TOOL",body:'Copilot without a case agent, in your case chat: attach your Case Pack (and any file the card names) and start with "Use only the attached file." A private chat gets only what your card says. Everything else \u2014 workspace, private chat, preview, reusable skill \u2014 is on the tool card: Appendix B of your M0 guide, and the Workflow Skills Library.'},{heading:"The change menu"},{table:[["Card","Option","How it arrives","What it hits first","The decision it forces"],["0 \xB7 My client's real change","Paste the text under your Ledger","Whatever your client actually sent: addendum, clarification answer, steering minutes, change request","Depends on the change: the impact map shows it","The same loop as every card: options, owner, date"],["1 \xB7 Budget cut or cap","\u221220% or \u221240%","Addendum or clarification answer; in running work, a steering decision","Phasing \xB7 price versus quality score \xB7 value target \xB7 contract form \xB7 prototype \xB7 team size","Cut, re-phase, change the delivery model or decline the cap \u2014 and which client Musts are declared as phase 2"],["2 \xB7 Earlier date","Go-live or evidence date, e.g. 8 weeks earlier","Steering decision; a regulator or board date in a clarification; timetable addendum","First release \xB7 key roles available by the start \xB7 fixed-price feasibility \xB7 dependencies \xB7 leading indicators","What ships first; add cost or cut scope; whether the date is a commitment or a target with conditions"],["3 \xB7 New AI or data condition","Data stays in the client tenant \xB7 no generative AI on personal data \xB7 human review of all AI output","DPO or security clarification; security questionnaire; annex","AI stories and prototype features \xB7 run cost \xB7 responsible-AI score \xB7 review effort \xB7 outcome-linked feasibility","Comply, offer a compliant alternative or qualify (legal) \u2014 and who carries the run-cost risk"],["4 \xB7 New decision-maker or evaluator","A role, e.g. a new CFO, or an adviser joins the panel","Organisation announcement; panel notified by procurement; steering minutes","Cast and whose metric \xB7 win themes \xB7 readout audience \xB7 bid conditions","Re-anchor the value story or keep it; how to gain access within the contact rules; whether to re-qualify"],["5 \xB7 Contract-form demand","Fixed price \xB7 outcome-linked option \xB7 service credits \xB7 liability \xB7 milestones","Addendum; contract redline; negotiation","Risk allocation \xB7 measurement \xB7 how precise scope must be \xB7 governance \xB7 the metric becomes contractual","Accept, accept with preconditions, counter with another form or walk away \u2014 with finance and legal"],["6 \xB7 Price pressure","Best and final offer, or a renewal benchmark","Invitation to a best and final offer; negotiation; benchmark report","Price score \xB7 value against price \xB7 scope \xB7 delivery model and AI assumptions \xB7 margin","Prove value, cut scope, change the model or trade risk for price \u2014 never a lower price for the same scope and team without saying what changed"],["7 \xB7 More volume or broader scope","+30% volume, or a further site, product or user group in phase 1","Clarification answer with revised volumes; scope addendum; in running work, a change request","Requirements and acceptance checks \xB7 service assumptions (volumes, hours, response times) \xB7 cost drivers \xB7 measurement baseline","Rebaseline, phase it or put it under change control \u2014 each changed requirement traced to an acceptance check, cost drivers restated for the new scenario"],["8 \xB7 Key capability unavailable","A key role or skill not there by the start, e.g. the integration lead","Our own staffing review; a key role reassigned; a partner withdrawing; a role the client asks for that we cannot evidence","Readiness \xB7 schedule \xB7 scope \xB7 delivery conditions \xB7 the team criterion and key-role commitments","Reskill, mentor, redeploy, partner or change the commitment \u2014 covered only with evidence and a credible date (enrolment is not competence); the readiness question goes to Module 9"]]}]},M9:{num:9,stageName:"Build",minutes:45,title:"Delivery Readiness \u2014 Team, Skills & Change",moment:"team still scores 1; adoption fell to 1 in the blind re-score",question:"In week 1 we scored ourselves 1 on team. Can we deliver this \u2014 and will their people use it?",intro:"The panel scores whether you can deliver, and the client lives with whether their people use it. One skill maps the skills this delivery needs against the role profiles you staff from \u2014 no names \u2014 and gives every gap a route, a test and a date. Part 2 writes the client's change and adoption plan.",steps:[{n:"1",min:"12",do:'Team and skills. New chat in your case workspace, "M9 \xB7 Readiness": paste the skill \u2014 eight role titles are pre-loaded \u2014 and your Ledger under it. Your own titles or cost ranges? Type them under the Ledger (a Case Builder pack: "Role profiles: as in 06"). Send. Read the date column first.',paste:"P1"},{n:"2",min:"9",do:"Adoption. Same chat: paste part 2. Read the user groups, the behaviour that shows adoption, the client commitments and the line for Module 11.",paste:"P2"},{n:"3",min:"6",do:"Gate. Same chat: paste the gate. Row M9, your first step, the Ledger.",paste:"Gate"}],beforeGate:"Before the gate: three minutes on your page \u2014 the workflow moment (page 2).",good:["Every gap has a route, a competence test, and a ready-by date before it is needed","Role profiles only \u2014 no name, no judgement, no figure you did not give","Every client commitment has a client owner by role"],stuck:['A name appears? "Titles only \u2014 names go in outside the chat."','Every gap reads "train"? Check the dates: training that ends after the start is not a route.','Copilot shows real names or rates? Use your case agent, or start with "Use only the attached files." \u2014 work mode searched your mail.'],notATender:'No formal RFP? "Key roles the client will evaluate" then means the roles the client will want to meet before it decides, and "team criterion" means how the client will judge whether we can deliver. The skill labels both H.',leaveWith:"Team and skills gap map \xB7 reskilling and sourcing path with offer lines \xB7 client change and adoption plan",page2:{momentHeading:"Workflow moment \u2014 three minutes before the gate",momentQuestion:"How is a pursuit team put together today \u2014 and when do you find out a key skill is missing?",momentRows:["When it starts","What I do \xB7 what AI does","What I check myself","Time it takes"],momentCols:["Today \u2014 how I do this now","From now \u2014 how I want to do it"],firstStepSuggestion:"For my next bid, name the two capability gaps, each with a test task, by ______"},appendixAIntro:["Copy from here \u2014 P1, P2 \u2026 are the pastes named on your module card. Your case workspace, a new chat, the module name as the chat name. Copilot: if the message is too long, send the skill alone \u2014 it asks for your Ledger."],prompts:[{id:"P1",title:"Workflow Skill M9 \u2014 Delivery readiness, team and skills",how:['New chat in your case workspace, "M9 \xB7 Readiness". No placeholders: eight role titles are pre-loaded. Your own titles or cost ranges go under your Ledger ("Role profiles: \u2026", "Cost ranges: \u2026"); a Case Pack from the Case Builder lists profiles in 06 \u2014 write "Role profiles: as in 06". Send.'],text:`WORKFLOW SKILL M9 \xB7 Delivery readiness \u2014 team and skills
Stage 5 of 7 \xB7 Build \xB7 AI-Native DCS Academy
Use when: scope, contract form and dates are set and the offer needs a team. Not for: naming or assessing people, pricing or HR decisions.

INPUTS
1. My Pursuit Ledger \u2014 pasted below this skill. Answer any "Next stage needs \u2014 for M9" line first, in the gap map; keep "(practice card N)" on lines a practised change drives. Required: if it is missing, ask me for it before anything else.
2. The case documents in this workspace.
3. Role profiles we staff from (titles only) \u2014 use these unless I give my own list under my Ledger: delivery manager; solution architect; business analyst; integration developer; full-stack developer; data engineer; test lead; change and adoption lead. Generic profiles are labelled A; a framework (SFIA, e-CF) only "to verify".
4. My cost ranges, only if I give them under my Ledger (e.g. "\u20AC1\u20133k per certification"); otherwise every cost reads "to validate with L&D / finance".
A required input is missing? Ask once, in one line; then write "Not provided \u2014 needs validation" and continue.

RULES
Facts come only from my case documents in this workspace, my Pursuit Ledger and this chat \u2014 no mail, chat, file or web search. Outside code, fictional records and test tasks, start every line or table cell with F [source] (document and section, "Ledger" or "my notes"), A (assumption) or H (hypothesis to validate). Where the sources are silent, write "Not provided \u2014 needs validation". Never decide bid / no-bid, price, margin, staffing or legal terms, and never assess a named person: mark such points "for DCS decision". Anonymised or synthetic material only; if you see a real name or personal data, say so once and continue without it.

STEPS
1. Skill demand: the skills this delivery needs, by phase, each sourced: stories, NFRs, governance duties, key-role requirements, the latest change, the contract form (outcome-linked: a measurement owner; managed service: run roles; fixed price: estimating). Add the AI-native skills the sources call for, e.g. evaluating AI output, human-in-the-loop design.
2. Gap map: match each skill to a role profile; coverage (H): demonstrated (a source shows it) \xB7 partial \xB7 not evidenced. Not in a profile = not evidenced, not incapable; never infer availability from a title. Profiles only, never a named person or an assessment of one (GDPR; AI rating staff may be AI Act high-risk \u2014 legal to confirm). Then the key roles the client will evaluate, for my Ledger's One truth: evidence, backup profile, continuity, needed by \u2014 the client's date (e.g. named CVs at submission), else the start. Names: mine, outside this chat.
3. Path for each partial or not evidenced skill: train, certify, hire, partner or client provides, with its trade-off; ready by (H, the route's lead time) vs needed by (my Ledger dates) \u2014 same date: "no slack", later: "late", for DCS decision (too slow to train: hire or partner); competence test \u2014 a task done successfully, never enrolment; certifications by category, "to verify"; cost: my range or "to validate with L&D / finance"; treatment \u2014 price line, internal investment, client-funded, assumption or risk with contingency \u2014 for DCS decision with finance.
4. Three lines, each headed "Next stage needs \u2014 for M10:": Assumption \xB7 Dependency \xB7 Risk with contingency. Then delivery readiness (H): ready \xB7 conditional (on what, by when) \xB7 not ready. Team criterion: latest assessed score in my Ledger, not a blind one \u2192 likely score (H), one step up at most on a plan alone; the evidence that would raise it.

OUTPUT
(1) Gap map: one table, max 10 rows \u2014 Skill and source \xB7 Phase \xB7 Role profile \xB7 Coverage \xB7 Why; then max 5 key-role lines. (2) Path: one table, one row per gap, max 6 rows, nearest needed-by first; more gaps: one line "Not routed yet \u2014 [gaps], for DCS decision" \u2014 Gap \xB7 Route and trade-off \xB7 Ready by vs needed by \xB7 Competence test \xB7 Cost \xB7 Treatment. (3) The three offer lines. (4) Readiness, then the score.

HUMAN CHECK \u2014 mine, before the gate
- Every gap has a route, a competence test and a ready-by date before it is needed.
- Role profiles only: no name, no judgement, no figure or FTE count I did not give (H lead times excepted).
- I would sign the three offer lines.

{{DISCIPLINE}}`,discipline:'Workshop output discipline \u2014 Return only what is requested above. No introduction, no recap, no commentary. Hard limits (source tags and labels not counted): (1) max 15 words per cell, key-role lines max 30 words; (2) max 15 words per cell, tags not counted; (3) max 35 words per line; (4) two lines, max 40 words each. If information is missing, write: "Not provided \u2014 needs validation." Do not fill gaps unless labelled as an assumption. Close with one line: "Further detail available on request." Nothing after it. A turn that ends on a question or a request to me ends on that line, without this line. (Remove this block after the workshop to receive the full output.)'},{id:"P2",title:"Part 2 \u2014 the client's change and adoption plan",how:["Same chat. Copy, paste, send. Want it to use your M2 persona or M6 journey? Paste them under part 2."],text:`Part 2 \u2014 the client's side. Act as an adoption lead who has seen tools abandoned. Same rules as the skill above. Use the gap map above, my Pursuit Ledger (cast, scope, outcome metric, contract form) and the case documents; personas or a journey only if I paste them below. The client owns this plan; we support it.

(1) Each user group the change touches \u2014 direct users first, then indirect ones such as team leads, support functions and external partners (max 5): what changes in their day, what they gain and what they lose (control, status, a trusted workaround) \xB7 a resistance hypothesis (H) with the signal that would confirm it \xB7 communication (message, messenger by role, moment) and training (format, timing against the releases, super-users) \xB7 one leading adoption metric, target "to agree with the client". Resistance is about a group, never a person.
(2) Adoption for the primary user role and for its manager: for each, the observable behaviour that shows they have adopted \u2014 what they do, where it is seen, by when. Adoption evidence is not a business outcome: say what links it to the outcome metric in my Ledger.
(3) The client commitments the plan depends on (max 4), each with the client role that owns it and by when; then the client's change owner, by role.
(4) My contract form puts fees at risk on an outcome? One line on how adoption could hit that fee and the precondition to agree first. If not, say so in one line.
(5) One line headed "Next stage needs \u2014 for M11:" \u2014 the group most likely to resist, among the users of my prototype \xB7 what it would lose \xB7 its workaround today \xB7 the one question to put to its persona.
(6) Adoption readiness (H): ready \xB7 conditional (on what, by when) \xB7 not ready. Then the adoption criterion: its latest assessed score in my Ledger, not a blind one \u2192 the likely score with this plan (H), one step up at most on a plan alone, and the evidence that would raise it.

{{DISCIPLINE}}`,discipline:'Workshop output discipline \u2014 Return only what is requested above. No introduction, no recap, no commentary. Hard limits (source tags and labels not counted): (1) one table, max 5 rows, 5 columns \u2014 Group \xB7 Change, gain and loss \xB7 Resistance (H) and signal \xB7 Communication and training \xB7 Leading metric \u2014 max 20 words per cell; (2) two lines, max 35 words each; (3) max 5 lines, max 20 words each; (4) one line, max 30 words; (5) one line, max 45 words; (6) two lines, max 30 words each. If information is missing, write: "Not provided \u2014 needs validation." Do not fill gaps unless labelled as an assumption. Close with one line: "Further detail available on request." Nothing after it. A turn that ends on a question or a request to me ends on that line, without this line. (Remove this block after the workshop to receive the full output.)'},{id:"GATE",title:"The gate \u2014 closes every module",how:['Same chat. Type your decision line first if you took one ("Decision: \u2026", with an owner and a date for each condition). Past case? Type "Case date: \u2026" too. Then paste, send.'],text:`GATE \u2014 close this module. Use only this chat and my last Pursuit Ledger.
(1) The human checks of the Workflow Skill I ran: for each, "shown", "missing" or "mine to confirm", with the evidence in this chat in one line.
