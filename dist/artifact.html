<title>Pursuit Navigator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;900&display=swap">
<style>
/* Pursuit Navigator — workspace for pursuits: white canvas, red + purple accents, purple-topped cards (works as a tool, not a landing page) */
:root{ --radius:6px; --font:"Source Sans 3","Source Sans Pro","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --red:#E31937; --red-700:#C1102B; --red-ink:#C1102B; --red-tint:#FDECEF; --red-line:#F6C6CF;
  --purple:#5236AB; --purple-700:#3F2A8A; --purple-900:#2A1A63; --purple-ink:#5236AB; --purple-line:#D9D1F6; --purple-soft:#B5A6E6; --tint:#F1EFFB; --tint-2:#F7F6FD;
  --ink:#1F1D2B; --ink-2:#3A384A; --muted:#6B6A7C; --line:#E3E1EE; --line-2:#EFEEF6; --bg:#FFFFFF; --surface:#FFFFFF; --soft:#F6F5FA; --soft-2:#EEF0F4;
  --amber:#FFF4D6; --amber-ink:#7A5600; --amber-line:#F1DD9A; --green:#E6F5EC; --green-ink:#17623C; --green-line:#BFE3CF; --blue:#E8F0FB; --blue-ink:#1D4E89; --blue-line:#C9DCF4;
  --code-bg:#1F1D2B; --toast:#1F1D2B; --sel:#D9D1F6; --shadow:0 1px 2px rgba(31,29,43,.06),0 6px 20px rgba(31,29,43,.06); }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --red:#E31937; --red-700:#C1102B; --red-ink:#FF8196; --red-tint:#3A1B26; --red-line:#6B2A3A;
  --purple:#6B52C9; --purple-700:#4A33A0; --purple-900:#2A1A63; --purple-ink:#B7A9F5; --purple-line:#473E86; --purple-soft:#5B4A9E; --tint:#27234A; --tint-2:#211F3A;
  --ink:#ECEBF6; --ink-2:#CFCDE0; --muted:#A09EB5; --line:#34324A; --line-2:#2A2940; --bg:#13121B; --surface:#1B1A26; --soft:#232232; --soft-2:#2B2A3B;
  --amber:#3B3216; --amber-ink:#F0D27A; --amber-line:#6E5B1E; --green:#16301F; --green-ink:#7ED3A0; --green-line:#285C3A; --blue:#172B45; --blue-ink:#8DB8EE; --blue-line:#2B4A70;
  --code-bg:#0D0C13; --toast:#3A3752; --sel:#4B3F8A; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); color-scheme:dark; } }
:root[data-theme="dark"]{ --red:#E31937; --red-700:#C1102B; --red-ink:#FF8196; --red-tint:#3A1B26; --red-line:#6B2A3A;
  --purple:#6B52C9; --purple-700:#4A33A0; --purple-900:#2A1A63; --purple-ink:#B7A9F5; --purple-line:#473E86; --purple-soft:#5B4A9E; --tint:#27234A; --tint-2:#211F3A;
  --ink:#ECEBF6; --ink-2:#CFCDE0; --muted:#A09EB5; --line:#34324A; --line-2:#2A2940; --bg:#13121B; --surface:#1B1A26; --soft:#232232; --soft-2:#2B2A3B;
  --amber:#3B3216; --amber-ink:#F0D27A; --amber-line:#6E5B1E; --green:#16301F; --green-ink:#7ED3A0; --green-line:#285C3A; --blue:#172B45; --blue-ink:#8DB8EE; --blue-line:#2B4A70;
  --code-bg:#0D0C13; --toast:#3A3752; --sel:#4B3F8A; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); color-scheme:dark; }
/* CGI Pursuit Navigator — CGI-inspired design: white canvas, CGI red + purple, strong sans-serif headlines, purple-topped cards. */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);font-size:16px;line-height:1.5}
h1,h2,h3,h4{line-height:1.2;margin:0 0 .5em;color:var(--ink);font-weight:700;letter-spacing:-.01em}
h1{font-size:2.4rem}h2{font-size:1.55rem}h3{font-size:1.15rem}h4{font-size:1rem}
p{margin:.4em 0 .8em}a{color:var(--purple-ink);text-decoration-thickness:1px;text-underline-offset:2px}a:hover{color:var(--red-ink)}
button{font:inherit;cursor:pointer}
.ic{flex:none;vertical-align:-3px}
.muted{color:var(--muted)}.small{font-size:.875rem}.xs{font-size:.78rem}.center{text-align:center}.right{text-align:right}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}.row.between{justify-content:space-between}.row.nowrap{flex-wrap:nowrap}
.stack{display:flex;flex-direction:column;gap:.9rem}.stack.tight{gap:.5rem}.grow{flex:1;min-width:0}
.mono{font-family:var(--mono);font-size:.85rem}
.hidden{display:none!important}
::selection{background:var(--sel)}
:focus-visible{outline:2px solid var(--purple);outline-offset:2px;border-radius:3px}

/* ---------- header ---------- */
.topbar{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1320px;margin:0 auto;padding:0 24px;height:64px;display:flex;align-items:center;gap:28px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);position:relative;padding-bottom:3px}
.brand .logo{font-weight:900;font-size:30px;letter-spacing:.5px;color:var(--red-ink);line-height:1;font-family:var(--font)}
.brand .sep{width:1px;height:26px;background:var(--line)}
.brand .name{font-weight:600;color:var(--purple-ink);font-size:1.02rem;line-height:1.1}
.brand .name small{display:block;font-weight:400;color:var(--muted);font-size:.72rem;letter-spacing:.02em}
.brand::after{content:"";position:absolute;left:0;bottom:-18px;width:36px;height:3px;background:var(--red)}
.nav{display:flex;gap:4px;margin-left:8px}
.nav a{padding:8px 12px;text-decoration:none;color:var(--ink-2);font-weight:600;border-radius:4px;font-size:.95rem;position:relative}
.nav a:hover{color:var(--purple-ink);background:var(--tint-2)}
.nav a.active{color:var(--purple-ink)}
.nav a.active::after{content:"";position:absolute;left:12px;right:12px;bottom:-14px;height:3px;background:var(--purple)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.ai-chip{display:flex;align-items:center;gap:8px;font-size:.82rem;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink-2);text-decoration:none}
.ai-chip .dot{width:8px;height:8px;border-radius:50%;background:#2fb26b}
.ai-chip.warn .dot{background:#e5a100}.ai-chip.off .dot{background:var(--red)}
.user-chip{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer;background:none;border:0}
.user-chip .av{width:28px;height:28px;border-radius:50%;background:var(--purple);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.8rem}

.wrap{max-width:1320px;margin:0 auto;padding:28px 24px 80px}
.footer{border-top:1px solid var(--line);padding:22px 24px;color:var(--muted);font-size:.82rem;text-align:center}
.footer b{color:var(--red-ink)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid transparent;border-radius:4px;padding:9px 18px;font-weight:700;font-size:.95rem;text-decoration:none;line-height:1.2;transition:.12s;white-space:nowrap}
.btn.primary{background:var(--red);color:#fff}.btn.primary:hover{background:var(--red-700);color:#fff}
.btn.purple{background:var(--purple);color:#fff}.btn.purple:hover{background:var(--purple-700);color:#fff}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}.btn.ghost:hover{border-color:var(--purple);color:var(--purple-ink)}
.btn.outline{background:var(--surface);border-color:var(--purple);color:var(--purple-ink)}.btn.outline:hover{background:var(--tint)}
.btn.danger{background:var(--surface);border-color:var(--red);color:var(--red-ink)}.btn.danger:hover{background:var(--red-tint)}
.btn.sm{padding:5px 11px;font-size:.84rem}.btn.lg{padding:13px 26px;font-size:1.05rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{background:none;border:0;color:var(--muted);padding:6px;border-radius:4px;display:inline-grid;place-items:center}.icon-btn:hover{background:var(--tint);color:var(--purple-ink)}
.mini{font-size:.75rem;padding:2px 8px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink-2)}.mini:hover{border-color:var(--purple);color:var(--purple-ink)}.mini.primary{background:var(--purple);color:#fff;border-color:var(--purple)}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.card.top{border-top:4px solid var(--purple)}.card.top.red{border-top-color:var(--red)}
.card.tint{background:var(--tint);border-color:var(--purple-line)}
.card.soft{background:var(--soft)}
.card h3{margin-bottom:.3em}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.card-head h3,.card-head h2{margin:0}
.eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--purple-ink)}
.eyebrow.red{color:var(--red-ink)}
.grid{display:grid;gap:18px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:980px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr}}
.callout{border-left:4px solid var(--purple);background:var(--tint);padding:12px 16px;border-radius:0 4px 4px 0;font-size:.95rem}
.callout.red{border-left-color:var(--red);background:var(--red-tint)}.callout.amber{border-left-color:#e5a100;background:var(--amber)}
.callout.green{border-left-color:#2fb26b;background:var(--green)}
.callout b:first-child{display:block;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}

/* ---------- chips / tags ---------- */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--ink-2);border:1px solid var(--line);line-height:1.5;vertical-align:1px}
.chip.purple{background:var(--tint);color:var(--purple-ink);border-color:var(--purple-line)}.chip.red{background:var(--red-tint);color:var(--red-ink);border-color:var(--red-line)}
.chip.green{background:var(--green);color:var(--green-ink);border-color:var(--green-line)}.chip.amber,.chip.gap{background:var(--amber);color:var(--amber-ink);border-color:var(--amber-line)}
.chip.rehearsed{background:var(--surface);color:var(--purple-ink);border:1px dashed var(--purple)}.chip.decide{background:var(--surface);color:var(--red-ink);border-color:var(--red)}
.chip.sim{background:var(--soft-2);color:var(--muted)}.chip.next{background:var(--blue);color:var(--blue-ink);border-color:var(--blue-line)}.chip.practice{background:var(--surface);color:var(--amber-ink);border:1px dashed var(--amber-line)}
.tag{display:inline-block;min-width:1.35em;text-align:center;font-weight:800;font-size:.72rem;padding:0 5px;border-radius:3px;margin-right:2px;line-height:1.5}
.tag-F{background:var(--purple);color:#fff}.tag-A{background:#8c8aa0;color:#fff}.tag-H{background:var(--surface);color:var(--red-ink);border:1.5px solid var(--red)}
.src{color:var(--muted);font-size:.85em}

/* ---------- forms ---------- */
label.f{display:block;font-weight:700;font-size:.88rem;margin-bottom:4px;color:var(--ink-2)}
label.f .req{color:var(--red-ink)}
.help{font-size:.82rem;color:var(--muted);margin-top:3px}
input[type=text],input[type=date],input[type=search],input[type=password],input[type=number],select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:4px;padding:9px 11px;transition:.12s}
textarea{resize:vertical;line-height:1.45;min-height:44px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 3px rgba(82,54,171,.14)}
input[type=checkbox],input[type=radio]{accent-color:var(--purple);width:17px;height:17px;margin:0}
.check{display:flex;gap:9px;align-items:flex-start;cursor:pointer}.check span{flex:1}
.field{margin-bottom:14px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 14px;font-weight:600;color:var(--ink-2)}.seg button.on{background:var(--purple);color:#fff}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow:auto}
.tabs button{background:none;border:0;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button:hover{color:var(--purple-ink)}.tabs button.on{color:var(--purple-ink);border-bottom-color:var(--purple)}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:1.25fr .9fr;gap:40px;align-items:center;padding:28px 0 36px}
.hero h1{font-size:3rem;margin-bottom:.35em}.hero h1 em{font-style:normal;color:var(--purple-ink)}
.hero p.lead{font-size:1.2rem;color:var(--ink-2);max-width:40ch}
.hero-art{background:linear-gradient(145deg,var(--purple-900),var(--purple) 60%,#7a5fd0);color:#fff;border-radius:10px;padding:26px;position:relative;overflow:hidden}
.hero-art::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(227,25,55,.9);filter:blur(0)}
.hero-art h4{color:#fff;position:relative;z-index:1;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.hero-stages{position:relative;z-index:1;display:grid;gap:8px;margin-top:10px}
.hero-stages div{display:flex;gap:12px;align-items:center;font-weight:600}
.hero-stages b{width:26px;height:26px;border-radius:50%;background:var(--surface);color:var(--purple-ink);display:grid;place-items:center;font-size:.8rem}
@media(max-width:900px){.hero{grid-template-columns:1fr}.hero h1{font-size:2.2rem}}

/* ---------- stage progress ---------- */
.stagebar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.stagebar i{height:6px;border-radius:2px;background:var(--line);display:block}.stagebar i.done{background:var(--purple)}.stagebar i.doing{background:var(--purple-soft)}
.pcard{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;transition:.15s}
.pcard:hover{box-shadow:var(--shadow);transform:translateY(-2px);border-color:var(--purple-line);color:inherit}
.pcard h3{margin:0;font-size:1.2rem}.pcard .client{color:var(--purple-ink);font-weight:700}
.stat{display:flex;gap:6px;align-items:center;font-size:.84rem;color:var(--muted)}
.stat b{color:var(--ink)}

/* ---------- pursuit layout ---------- */
.ws{display:grid;grid-template-columns:268px minmax(0,1fr);gap:28px;align-items:start}.ws-main{min-width:0}
.side{position:sticky;top:84px;max-height:calc(100vh - 100px);overflow:auto;padding-right:4px}
.side h4{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:18px 0 6px}
.side .ptitle{font-size:1.12rem;font-weight:700;line-height:1.25}.side .pclient{color:var(--purple-ink);font-weight:700;font-size:.9rem}
.side a.nl{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:4px;color:var(--ink-2);text-decoration:none;font-weight:600;font-size:.93rem}
.side a.nl:hover{background:var(--tint-2);color:var(--purple-ink)}.side a.nl.on{background:var(--tint);color:var(--purple-ink);box-shadow:inset 3px 0 0 var(--purple)}
.side a.mod{display:flex;gap:9px;align-items:center;padding:6px 10px;border-radius:4px;text-decoration:none;color:var(--ink-2);font-size:.9rem}
.side a.mod:hover{background:var(--tint-2)}.side a.mod.on{background:var(--tint);color:var(--purple-ink);font-weight:700}
.sdot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:10px;color:#fff;font-weight:800;background:var(--surface)}
.sdot.doing{border-color:var(--purple);background:var(--surface)}.sdot.doing::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--purple)}
.sdot.done{background:var(--purple);border-color:var(--purple)}
.side .stg{font-size:.72rem;color:var(--muted);font-weight:700;margin:10px 10px 2px;letter-spacing:.06em}
@media(max-width:980px){.ws{grid-template-columns:minmax(0,1fr)}.side{position:static;max-height:none}}

/* ---------- journey ---------- */
.journey{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.jstage{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--line);border-radius:var(--radius);padding:12px 10px}
.jstage.done{border-top-color:var(--purple)}.jstage.doing{border-top-color:var(--purple-soft)}.jstage.next{border-top-color:var(--red)}
.jstage h4{margin:0 0 6px;font-size:.92rem}.jstage .n{font-size:.7rem;color:var(--muted);font-weight:700;letter-spacing:.08em}
.jstage a{display:grid;grid-template-columns:14px auto;column-gap:7px;align-items:center;font-size:.82rem;text-decoration:none;color:var(--ink-2);padding:4px 0}.jstage a:hover{color:var(--purple-ink)}
.jstage a .jt{grid-column:2;line-height:1.2;margin-top:-2px}.jstage a b{font-size:.84rem}
@media(max-width:1100px){.journey{grid-template-columns:repeat(4,1fr)}}@media(max-width:640px){.journey{grid-template-columns:repeat(2,1fr)}}

/* ---------- next step banner ---------- */
.nextstep{display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:linear-gradient(100deg,var(--purple-900),var(--purple));color:#fff;border-radius:8px;padding:22px 26px}
.nextstep h2{color:#fff;margin:2px 0}.nextstep .eyebrow{color:#ffd1d8}.nextstep p{margin:0;opacity:.9;max-width:62ch}

/* ---------- module page ---------- */
.mhead{border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:22px}
.mhead h1{font-size:2rem;margin:.1em 0 .25em}
.mhead .q{font-size:1.15rem;color:var(--purple-ink);font-weight:600;margin:0 0 .5em}
.mod-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:26px;align-items:start}
@media(max-width:1100px){.mod-layout{grid-template-columns:minmax(0,1fr)}}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:16px;overflow:hidden}
.step-head{display:flex;gap:14px;align-items:center;padding:14px 18px;cursor:pointer;background:var(--surface);border-bottom:1px solid transparent}
.step.open .step-head{border-bottom-color:var(--line);background:var(--tint-2)}
.step-n{width:32px;height:32px;border-radius:50%;background:var(--soft);border:2px solid var(--line);display:grid;place-items:center;font-weight:800;color:var(--muted);flex:none}
.step.done .step-n{background:var(--purple);border-color:var(--purple);color:#fff}.step.open .step-n{border-color:var(--purple);color:var(--purple-ink);background:var(--surface)}.step.done.open .step-n{color:#fff;background:var(--purple)}
.step-head h3{margin:0;font-size:1.05rem}.step-head .meta{margin-left:auto;display:flex;gap:8px;align-items:center;color:var(--muted);font-size:.82rem}
.step-body{padding:18px}
.step-desc{color:var(--ink-2);margin:0 0 14px}
.runbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.msg{margin-top:16px}
.msg .mbar{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:.78rem;color:var(--muted)}
.msg .mbar .sp{flex:1}
.bubble-u{background:var(--tint);border:1px solid var(--purple-line);border-radius:8px 8px 2px 8px;padding:10px 14px;margin-left:12%}
.bubble-sent{border:1px dashed var(--line);border-radius:6px;padding:7px 12px;font-size:.84rem;color:var(--muted);display:flex;gap:8px;align-items:center}
.bubble-sent button{margin-left:auto}
.out{border:1px solid var(--line);border-left:4px solid var(--purple);border-radius:0 6px 6px 0;padding:6px 18px 10px;background:var(--surface);overflow-x:auto}
.out.streaming{border-left-color:var(--red)}
.out h2,.out h3,.out h4,.out h5{margin:1em 0 .4em}.out h2{font-size:1.25rem}.out h3{font-size:1.08rem}.out h4,.out h5,.out h6{font-size:.98rem;color:var(--purple-ink)}
.out ul,.out ol{margin:.3em 0 .8em;padding-left:1.4em}.out li{margin:.15em 0}
.out blockquote{margin:.6em 0;padding:6px 14px;border-left:3px solid var(--line);color:var(--muted)}
.out code,.md code{background:var(--soft);padding:1px 5px;border-radius:3px;font-size:.88em;font-family:var(--mono)}
.tbl-wrap{overflow-x:auto;margin:.7em 0}
.out table,.md table{border-collapse:collapse;width:100%;font-size:.9rem}
.out th,.md th{background:var(--purple);color:#fff;text-align:left;padding:7px 10px;font-weight:700;vertical-align:bottom}
.out td,.md td{padding:7px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
.out tbody tr:nth-child(even) td,.md tbody tr:nth-child(even) td{background:var(--tint-2)}
pre.code{background:var(--code-bg);color:#e8e6f5;border-radius:0 0 6px 6px;padding:12px 14px;overflow:auto;font-size:.8rem;line-height:1.45;margin:0 0 .8em;max-height:420px}
pre.code.collapsed{display:none}pre.code.small{max-height:220px;border-radius:6px}
.code-bar{display:flex;gap:6px;align-items:center;background:#35324a;color:#cfcbe8;padding:5px 10px;border-radius:6px 6px 0 0;font-size:.75rem;margin-top:.6em}.code-bar span{margin-right:auto;text-transform:uppercase;letter-spacing:.08em}
.err{border:1px solid var(--red-line);background:var(--red-tint);color:var(--red-ink);padding:10px 14px;border-radius:4px;margin-top:12px}
.dots::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(4,end) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.chatbox{margin-top:14px;display:flex;gap:10px;align-items:flex-end}
.chatbox textarea{flex:1}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.quick button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.84rem;color:var(--ink-2);text-align:left;max-width:100%}.quick button:hover{border-color:var(--purple);color:var(--purple-ink);background:var(--tint-2)}

.aside .card{margin-bottom:16px;padding:16px}
.aside h4{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--purple-ink);margin-bottom:8px}
.aside ul{margin:0;padding-left:1.1em}.aside li{margin:.25em 0;font-size:.92rem}
.hc{display:flex;flex-direction:column;gap:8px}
.hc label{display:flex;gap:9px;font-size:.92rem;align-items:flex-start;cursor:pointer}
.never{border-top:4px solid var(--red)}
.never li{font-size:.88rem}

.gate{border:2px solid var(--purple);border-radius:8px;background:var(--surface);margin-top:26px;overflow:hidden}
.gate-head{background:var(--purple);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px}
.gate-head h3{color:#fff;margin:0}.gate-body{padding:20px}
.cond{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,1.5fr) 160px 32px;gap:8px;margin-bottom:8px;align-items:start}
@media(max-width:800px){.cond{grid-template-columns:1fr}}
.review3{display:grid;gap:14px}
.review3 .card{padding:14px}

/* ---------- ledger ---------- */
.lfields{display:grid;gap:14px}
.lfield{border:1px solid var(--line);border-left:4px solid var(--purple);border-radius:0 6px 6px 0;padding:12px 16px;background:var(--surface)}
.lfield.fixed{border-left-color:var(--red)}
.lfield h4{margin:0 0 6px;display:flex;gap:8px;align-items:center;font-size:.95rem}
.lfield h4 .num{width:22px;height:22px;border-radius:50%;background:var(--purple);color:#fff;display:grid;place-items:center;font-size:.75rem}
.lfield.fixed h4 .num{background:var(--red)}
.md p{margin:.3em 0}.md ul,.md ol{margin:.2em 0;padding-left:1.3em}

/* ---------- workflow map ---------- */
.wmap{width:100%;border-collapse:separate;border-spacing:6px;table-layout:fixed}
.wmap th{background:var(--soft);border-top:4px solid var(--line);padding:10px;text-align:left;font-size:.9rem;color:var(--ink)}
.wmap th.lit{border-top-color:var(--purple);background:var(--tint)}
.wmap td{vertical-align:top;background:var(--surface);border:1px solid var(--line);padding:8px 10px;font-size:.84rem;border-radius:4px;min-height:48px}
.wmap td.rowh{background:var(--soft);font-weight:700;color:var(--ink-2);width:11%}
.wmap .heat{background:linear-gradient(0deg,rgba(82,54,171,.14),rgba(82,54,171,0))}
.wscroll{overflow-x:auto}.wmap{min-width:980px}

/* ---------- misc ---------- */
.empty{border:2px dashed var(--line);border-radius:8px;padding:34px;text-align:center;color:var(--muted)}
.drop{border:2px dashed var(--purple-line);background:var(--tint-2);border-radius:8px;padding:26px;text-align:center;color:var(--ink-2);transition:.12s}
.drop.over{background:var(--tint);border-color:var(--purple)}
.src-item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line-2)}
.src-item:last-child{border-bottom:0}
.src-item .ico{width:38px;height:38px;border-radius:6px;background:var(--tint);color:var(--purple-ink);display:grid;place-items:center;flex:none}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:.92rem}.kv dt{color:var(--muted);font-weight:600}.kv dd{margin:0}
.progress{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--purple);transition:width .3s}
.timeline{border-left:2px solid var(--line);margin-left:8px;padding-left:18px}
.timeline .ev{position:relative;margin-bottom:14px}.timeline .ev::before{content:"";position:absolute;left:-26px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--purple)}
.timeline .ev.late::before{border-color:var(--red)}.timeline .ev.done::before{background:var(--purple)}
table.tbl{border-collapse:collapse;width:100%;font-size:.92rem}table.tbl th{text-align:left;font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:6px 10px;border-bottom:2px solid var(--line)}table.tbl td{padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
.badge-num{background:var(--red);color:#fff;border-radius:999px;font-size:.72rem;font-weight:800;padding:1px 7px}
.preview-frame{width:100%;height:560px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 5px;font-size:.8rem;background:var(--surface)}

/* toasts & modal */
#toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{display:flex;gap:10px;align-items:center;background:var(--toast);color:#fff;padding:11px 16px;border-radius:6px;box-shadow:var(--shadow);max-width:420px;animation:in .2s}
.toast.error{background:var(--red-700)}.toast.ok{background:var(--purple-700)}.toast.out{opacity:0;transform:translateY(6px);transition:.3s}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.modal-back{position:fixed;inset:0;background:rgba(31,29,43,.55);display:grid;place-items:center;z-index:150;padding:20px;overflow:auto}
.modal{background:var(--surface);border-radius:8px;width:min(560px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35);border-top:4px solid var(--red)}
.modal.wide{width:min(900px,100%)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 6px}.modal-head h3{margin:0}
.modal-body{padding:8px 20px 16px;overflow:auto}.modal-foot{padding:12px 20px 18px;display:flex;gap:10px;justify-content:flex-end}
.tooltip-note{font-size:.8rem;color:var(--muted)}
@media print{.topbar,.side,.footer,.runbar,.btn,.icon-btn,.chatbox,.mod-layout .aside{display:none!important}.ws{grid-template-columns:1fr}.wrap{padding:0}}

/* ---------- details-based module nav ---------- */
.modnav summary{list-style:none;cursor:pointer;font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;margin:18px 0 6px}
.modnav summary::-webkit-details-marker{display:none}
.modnav summary::after{content:" ▾"}.modnav:not([open]) summary::after{content:" ▸"}

/* ---------- small screens ---------- */
@media(max-width:980px){
  .wrap{padding:18px 16px 60px}
  .side .cockpit{display:flex;flex-wrap:wrap;gap:6px}
  .side a.nl{border:1px solid var(--line);padding:6px 10px;font-size:.88rem}.side a.nl.on{box-shadow:none;border-color:var(--purple)}
  .side .badge-num{margin-left:6px!important}
  .side{padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:6px}
}
@media(max-width:860px){
  h1{font-size:1.85rem}.mhead h1{font-size:1.55rem}
  .topbar-in{height:auto;flex-wrap:wrap;gap:6px 12px;padding:8px 14px}
  .brand::after{display:none}.brand .name small{display:none}.brand .logo{font-size:26px}
  .nav{order:3;width:100%;overflow-x:auto;margin-left:-6px;gap:0;padding-bottom:2px}.nav a{padding:6px 10px;white-space:nowrap;font-size:.9rem}.nav a.active::after{bottom:-2px;left:10px;right:10px}
  .top-right{margin-left:auto;gap:8px}.ai-chip{max-width:150px;font-size:.74rem;padding:4px 9px}.ai-chip span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .user-chip{font-size:0}.user-chip .av{font-size:.8rem}
  .step-head{flex-wrap:wrap;gap:8px 12px}.step-head .meta{margin-left:0;flex-wrap:wrap}
  .nextstep{padding:18px}.nextstep h2{font-size:1.3rem}
  .gate-body,.step-body{padding:14px}
  .grid[style*="grid-template-columns"]{grid-template-columns:1fr!important}
  .kv{grid-template-columns:1fr}.btn{white-space:normal;text-align:left}
  .bubble-u{margin-left:0}
  .modal{max-height:96vh}.preview-frame{height:420px}
}

.side a.mod.soon{opacity:.55}
.side a.mod.soon.on{opacity:1}
.empty-slot{border:2px dashed var(--amber-line);background:var(--amber);border-radius:6px;padding:18px;text-align:center;color:var(--amber-ink)}


/* ---- artifact additions: safe areas, gutters, theme-aware chrome ---- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
.topbar{top:env(safe-area-inset-top,0px)}
.topbar-in,.wrap,.footer{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#toasts{right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.modal-back{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand .name{white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

fter: check before you act. A fluent AI draft and a correct one look exactly alike; only the source tells them apart.",steps:[{n:"1",min:"5",do:'Your case in five lines. In your case workspace, start a new chat, "M0 \xB7 Foundations". Paste, send. Read: your documents named, five tagged lines, Ledger v0.',paste:"P1"},{n:"2",min:"13",do:'Find what is wrong. A private chat (tool card) with your Case Pack attached: paste the seed. Hunt by eye, Case Pack open: each claim supported, contradicted or not in my pack. Then paste "reveal" in the same chat.',paste:"P2 \xB7 P4"},{n:"3",min:"7",do:"Gate. Back in your M0 chat, paste the gate. Two pastes into My Pursuit Workflow: the table on the grey M0 row (sheet Workflow), the Ledger into the M0 cell (sheet Ledger). Checklist on your page.",paste:"Gate"}],beforeGate:"Before the gate: three minutes on your page \u2014 the workflow moment (page 2).",good:["The setup line names every document of your Case Pack","You found at least three of the five \u2014 and know which one would have reached a client",`Ledger v0 saved \u2014 the gate's: Case, Stage reached and Open filled; Decisions I took "\u2014"`],stuck:['No case workspace? New chat, attach your Case Pack, first line: "Use only the attached file \u2014 no mail, chat, file or web search."',"No private chat in your tool? A new chat outside your workspace with memory off (tool card) \u2014 never seed inside your workspace.",'Copilot quotes your mail? Use your case agent, or start with "Use only the attached file".'],notATender:'Renewal, change request or your own proposal? Same five lines: in "Need", name the route \u2014 "renewal of \u2026", "change request on \u2026", "own proposal to \u2026". Every module tells you in one line what changes for your route.',leaveWith:"A working setup \xB7 your case in five lines \xB7 Pursuit Ledger v0 \xB7 the habit of checking before acting",page2:{momentHeading:"Workflow moment \u2014 three minutes before the gate",momentQuestion:"Module 0 has no stage of its own: how do you use AI in pursuit work today, and how do you check what it gives you?",momentRows:["When I use AI in a pursuit","How I check what it gives me"],momentCols:["Today \u2014 how I do this now","From now \u2014 how I want to do it"],firstStepSuggestion:'Run "my case in five lines" on my next real pursuit \u2014 date ______ \u2014 with ______'},appendixAIntro:["Copy from here. P1 and the gate: your M0 chat, in your case workspace. P2\u2013P4: a private chat with your Case Pack attached \u2014 never your workspace."],prompts:[{id:"P1",title:"My case in five lines \u2014 your M0 chat, in your case workspace",how:['New chat in your case workspace, named "M0 \xB7 Foundations". Copy, paste, send \u2014 no placeholders. Read the setup line first: if none of your documents is named, attach your Case Pack to the chat.'],text:`MY CASE IN FIVE LINES \xB7 setup check \xB7 Pursuit Ledger v0
AI-Native DCS Academy \xB7 Module 0 \xB7 Foundations

RULES
Facts come only from my case documents in this workspace, my Pursuit Ledger and this chat \u2014 no mail, chat, file or web search. Outside code, fictional records and test tasks, start every line or table cell with F [source] (document and section, "Ledger" or "my notes"), A (assumption) or H (hypothesis to validate). Where the sources are silent, write "Not provided \u2014 needs validation". Never decide bid / no-bid, price, margin, staffing or legal terms, and never assess a named person: mark such points "for DCS decision". Anonymised or synthetic material only; if you see a real name or personal data, say so once and continue without it.

STEPS
1. Setup check: name each document of my Case Pack you can read (number and title), and any document in the pack you cannot open.
2. My case in five lines. Client: who they are and why they are moving now. Need: what they want to buy or change, and the route (tender, renewal, change request or own proposal). Outcome: the result they want, with baseline and target if given. Decision: who decides and who evaluates (roles), and by when. Us: our position, our history with this client, the main competitor.
3. Pursuit Ledger v0 with exactly these eight fields, in this order: 1 Case \xB7 2 Cast \xB7 3 One truth \xB7 4 Stage reached \xB7 5 Decisions I took \xB7 6 Artefacts \xB7 7 Open \u2014 to validate \xB7 8 Next stage needs. Fill only Case (client alias \xB7 sector \xB7 what is being bought \xB7 my role \u2014 one line, from step 2) and Open \u2014 to validate (the three gaps that matter most for this pursuit, each: what \xB7 with whom \xB7 by when). Write "\u2014" in every other field.

HUMAN CHECK \u2014 mine, before the gate
- Every figure, date and name in the five lines is where its tag says in my Case Pack.
- Open holds real gaps, not things my Case Pack already answers.
- No real client name or personal data appears.

{{DISCIPLINE}}`,discipline:'Workshop output discipline \u2014 Return only what is requested above. No introduction, no recap, no commentary. Hard limits (source tags and labels not counted): (1) one line, max 50 words; (2) five lines, max 30 words each, each line starting F [source], A or H; (3) the eight field names in bold, "\u2014" for an empty field, max 120 words in all. If information is missing, write: "Not provided \u2014 needs validation." Do not fill gaps unless labelled as an assumption. Close with one line: "Further detail available on request." Nothing after it. A turn that ends on a question or a request to me ends on that line, without this line. (Remove this block after the workshop to receive the full output.)'},{id:"P2",title:"The seed \u2014 a private chat, Case Pack attached",how:["Private chat (tool card), never your case workspace. Attach your Case Pack file. Copy, paste, send. Keep this tab open: the reveal (P4) runs here."],text:`PLANTED ERRORS \xB7 step 1 of 2 \u2014 a private chat, my Case Pack attached. This chat writes a draft; I check it by eye against my Case Pack.
Use only the attached Case Pack \u2014 no mail, chat, file or web search. For this exercise only: no F/A/H labels and no source tags in the draft.
Write "Client summary (draft)" of my Case Pack as a junior analyst would for a colleague: fluent, confident, four short paragraphs.
Plant exactly four errors that contradict my Case Pack: one wrong number \xB7 one wrong date or evaluation criterion \xB7 one invented quote or interview, attributed to a role in my Case Pack \xB7 one over-claim, or a rule or regulation that does not exist. Add exactly one plausible claim my Case Pack does not cover at all. Spread them over the four paragraphs; everything else must match my Case Pack. The errors and the extra claim are the exercise: write them as plain statements, unlabelled, with no "Not provided" anywhere in the draft.
Keep the answer key to yourself until I write "reveal".

{{DISCIPLINE}}`,discipline:'Workshop output discipline \u2014 Return only what is requested above. No introduction, no recap, no commentary. Hard limits (source tags and labels not counted): the title and four paragraphs only, max 250 words in all (each paragraph under 60 words); no key, no hint, no labels, no comment. The planted claims are deliberate: no labels, no "Not provided". Nothing after the last item requested. (Remove this block after the workshop to receive the full output.)'},{id:"P3",title:"Optional, before the reveal \u2014 a second private chat checks the draft",how:["Finished your hunt early? Copy the draft, open a second private chat with your Case Pack attached, paste this with the draft where it says. The first chat knows the key, so the check runs in a new one. Then go back for the reveal."],text:`PRIVATE CHECK \xB7 optional \u2014 a second private chat, my Case Pack file attached, after my own hunt by eye and before the reveal.
Use only the attached Case Pack \u2014 no mail, chat, file or web search, and nothing from earlier chats.
Check the draft below against the Case Pack. For every factual claim, one verdict:
- Supported \u2014 the Case Pack says the same; give the tag (document and section).
- Contradicted \u2014 the Case Pack says something different; give the tag and the correct fact.
- Not in my pack \u2014 it cannot be checked; do not confirm or deny it from outside knowledge. A law, publication, interview or quote that is not in the Case Pack goes here.

DRAFT
[PASTE THE DRAFT HERE]

{{DISCIPLINE}}`,discipline:'Workshop output discipline \u2014 Return only what is requested above. No introduction, no recap, no commentary. Hard limits (source tags and labels not counted): one table, columns Claim \xB7 Verdict \xB7 Tag and correct fact; max 12 rows \u2014 group Supported claims, give every Contradicted or Not in my pack claim its own row; max 20 words per cell. If information is missing, write: "Not provided \u2014 needs validation." Do not fill gaps unless labelled as an assumption. Close with exactly this line: "Contradicted: N \xB7 Not in my pack: N" Nothing after it. (Remove this block after the workshop to receive the full output.)'},{id:"P4",title:"The reveal \u2014 the first private chat, after your hunt",how:["Only after you have marked every claim by eye: supported, contradicted, or not in my pack. Then close the private chat(s)."],text:`reveal
PLANTED ERRORS \xB7 step 2 of 2 \u2014 same private chat, after my hunt by eye. Give the answer key: the four planted errors and the one claim my Case Pack does not cover \u2014 for each, the claim as written, its type, and the correct fact with its tag (document and section, or "my notes"), or "not in my pack". Then withdraw the draft: from here on, use no claim from it, in this chat or anywhere else.

{{DISCIPLINE}}`,discipline:'Workshop output discipline \u2014 Return only what is requested above. No introduction, no recap, no commentary. Hard limits (source tags and labels not counted): one table, exactly 5 rows, columns Claim as written \xB7 Type \xB7 Correct fact and tag; max 20 words per cell. Close with exactly this line: "Draft withdrawn \u2014 not used in my Ledger." Nothing after it. (Remove this block after the workshop to receive the full output.)'},{id:"GATE",title:"The gate \u2014 closes every module",how:['Same chat. Type your decision line first if you took one ("Decision: \u2026", with an owner and a date for each condition). Past case? Type "Case date: \u2026" too. Then paste, send.'],text:`GATE \u2014 close this module. Use only this chat and my last Pursuit Ledger.
(1) The human checks of the Workflow Skill I ran: for each, "shown", "missing" or "mine to confirm", with the evidence in this chat in one line.
(2) My workflow row: a one-row table with the columns Stage \xB7 Module \xB7 Trigger (when I will run this) \xB7 Input \xB7 Workflow Skill \xB7 Human check \xB7 Output.
(3) My updated Pursuit Ledger with exactly these eight fields: 1 Case (client alias \xB7 sector \xB7 what is being bought \xB7 my role \u2014 one line) \xB7 2 Cast (one line per role \u2014 alias \xB7 what they want \xB7 what they will test us on: decision-maker (with H1\u2013H3 in full) \xB7 CFO \xB7 lead evaluator \xB7 delivery lead (ours) \xB7 primary user \xB7 data protection or risk) \xB7 3 One truth (bid decision and its conditions in full, with owners and dates \u2014 later reopen and bid-board conditions included (or the no-bid as recorded) \xB7 phase-1 scope (story IDs with the client's priority) \xB7 budget or cap, and what it includes \xB7 outcome metric with baseline and target, by when \xB7 key dates \xB7 contract form with its parts and its label (decision or H) \xB7 key roles \xB7 latest assessed score per criterion (1\u20135, with its module \u2014 blind re-scores beside it, never instead) \xB7 win themes (titles)) \xB7 4 Stage reached (module and date) \xB7 5 Decisions I took (numbered, each with its module and its conditions in full \u2014 where One truth already states what was decided (the bid conditions included), a short name and the module are enough) \xB7 6 Artefacts (name \xB7 where it lives (chat or file)) \xB7 7 Open \u2014 to validate (what \xB7 with whom \xB7 by when) \xB7 8 Next stage needs (word for word, every line a skill headed "Next stage needs \u2014 for Mx", kept until module x has run; otherwise one line).
Fields 1\u20133 are the fixed block: copy them word for word from my last Ledger and change only what this module changed, marking each change with this module, e.g. "(M8)". Never shorten the cast lines, H1\u2013H3, the bid conditions, the cap and what it includes, commercial figures, the contract form, the scores or the win themes; anything this module adds to fields 1\u20133 for the first time, copy word for word from this chat. Fields 4\u20138 roll: carry every decision with its conditions and every open item forward unless this module closed it (a decision whose content One truth already states needs only a short name and its module); copy word for word any lines a skill headed "Next stage needs \u2014 for Mx" and keep each until module x has run. Labels stay as they are ("H", "to confirm", "practice card"). Record as a decision only what I typed as a decision; everything else stays "Open". A rehearsal or simulation result is "rehearsed \u2014 not validated", never a client fact or an approval. Any condition in One truth whose date is on or before the date I typed (else today) is "met" only if this chat shows it; otherwise add to Open "missed \u2014 reopen qualification (renewal or change request: reopen that decision), for DCS decision". If the Ledger runs long, shorten Artefacts first and list under Open anything you removed; then merge Open items that share an owner, each part keeping its own date, and cut each item to what \xB7 with whom \xB7 by when \u2014 never drop one.

, or a Project with the skill in its instructions. Custom GPTs retire on 11 December 2026 (11 February 2027 where a deferral was approved) \u2014 no new ones in Enterprise","Agent Builder agent (8,000 characters, 20 files), or a skill if enabled","A Skill (rolling out since October 2026), or a Gem (10 files) until Gems convert to Skills, no sooner than 1 March 2027"],["Watch","Chats in one Project can see each other: use a Temporary Chat where the guide says private",'Paste limits vary by tenant and are not published: if skill and Ledger will not go in one message, send the skill alone \u2014 it asks for the Ledger \u2014 then paste the Ledger. Ledger alone too long? Paste fields 1\u20133 with the line "Ledger part 1 of 2 \u2014 wait for part 2", then fields 4\u20138. An answer stops mid-way? Type "Continue from where you stopped."',"Ten files per Gem: keep your Case Pack as one file"]]},{heading:"State of 9 November 2026. Products change monthly: the facilitator re-checks this card in the CGI tenants one week before each cohort."},{heading:"Sources for slides 8\u201310"},{heading:"Checked by web search on 9 November 2026. Read the qualifier before you repeat a figure."},{table:[["On the slide","Claim","Source and date","Read it as"],["Pricing","Persistent Systems CEO: clients demand the same work for 25\u201330% less (Reuters' paraphrase); TCS: about 80% of contracts in its business-services segment use outcome measures",`Reuters, "AI reshapes India's IT services sector contracts as clients demand more for less", 21 Aug 2026`,`One CEO and one firm's segment \u2014 never "the market"`],["Contracts","Large IT services contracts (above $50 M a year) reopened within 24 months of signing; talks move from FTEs and rate cards to productivity commitments, outcome pricing and gain-share",'HFS Research news, "AI drives IT contract renegotiations within 24 months as pricing models shift", 30 Jun 2026','Analyst view: "increasingly"; no share given, no contracts named'],["Proof","More than 60% of business buyers use a trial; 78% for purchases of $10 M or more","Forrester, The State of Business Buying, 2026 \u2014 press release, 21 Jan 2026","All B2B buying, not IT services only"],["AI in the bid","Public buyers may ask suppliers to disclose AI use in the tender and in delivery; answers for information, not scored","UK Cabinet Office, PPN 017 Improving transparency of AI use in procurement \u2014 published 17 Feb 2025, applies from 24 Feb 2025","UK public sector only"],["AI in the bid",'Digital Omnibus on AI in force 27 Jul 2026: Annex III high-risk duties from 2 Dec 2027, Annex I from 2 Aug 2028; AI-literacy duty becomes "take measures"','Lewis Silkin, "The Digital Omnibus on AI enters into force today", 27 Jul 2026',"Law-firm summary: check the Official Journal text with legal before quoting in a bid"],["Teams",'Mphasis CEO: L0/L1 work "completely human-less"; the pyramid "more likely to have a little bit of a diamond shape"','Analytics India Magazine, "Why Indian IT is quietly abandoning the pyramid workforce", 3 Feb 2026',"One firm's view"],["Teams","Generative AI will require 80% of the engineering workforce to upskill through 2027","Gartner press release, 3 Oct 2024","A forecast; engineers, not consultants or directors"],["Slide 7","Jagged frontier: 758 BCG consultants; inside the frontier 12.2% more tasks, 25.1% faster, 40% higher quality; outside it 19 percentage points less likely to be correct","Dell'Acqua et al., Harvard Business School Working Paper 24-013, Sep 2023","One experiment, one firm's consultants, 2023 models"]]}]},M1:{num:1,stageName:"Understand",minutes:30,title:"My Workflow Today",moment:"at the steering committee of our data engagement, the client says it will go to market",question:"This is where my time goes, and where the next pursuit starts.",intro:"Time saved means nothing without the time spent. One Workflow Skill reads your five-minute form \u2014 your hours exactly as you wrote them \u2014 and names the three stages worth changing, each with a check you can open. Your map already shows Today; row 5 shows what a year of pursuits costs you.",steps:[{n:"1",min:"8",do:'Map my workflow. New chat in your case workspace, "M1 \xB7 My workflow": paste the skill, your Ledger under it; send. It asks for your form: sheet Hours, copy A3:C14, paste, send.',paste:"P1"},{n:"2",min:"5",do:"The VP challenge. Same chat: paste the VP. Then decide: keep your three stages, or swap one.",paste:"P2"},{n:"3",min:"4",do:'Gate. Same chat, one message: your workflow note \u2014 "Workflow note (M1) \u2014 Artefacts, not a decision: I keep \u2026" \u2014 and the gate under it. Row M1, first step, Ledger.',paste:"Gate"}],beforeGate:"Before the gate: three minutes on your page \u2014 the workflow moment (page 2).",good:["Every hour on screen is one you wrote \u2014 ranges kept, no total from the model","Row 5 of your map: your hours a year, from your own figures","Three stages to reclaim, each with a check you can open"],stuck:["No form? Three minutes in the sheet Hours: hours per stage (a number of hours first), where the time goes, and the three lines under the stages.",'Never led a full pursuit? Use the last one you worked on, your own hours only; "not mine" for the rest.','The model rounded or totalled your hours? Send: "Repeat my hours exactly as I wrote them, no total."'],notATender:'Renewal or account work? Use your last renewal or change request as "my last pursuit". The seven stages still apply; a stage you did not run is "skipped". Pursuits a year: count only renewals or change requests of about this size.',leaveWith:"My workflow today, stage by stage \xB7 three stages worth changing, each with a check \xB7 row 5 of my map: a year of pursuits",page2:{momentHeading:"Workflow moment \u2014 three minutes before the gate",momentQuestion:"Stage 1, Understand, starts with your own time. Where did your hours surprise you?",momentRows:["When it starts","What I do \xB7 what AI does","What I check myself"],momentCols:["Today \u2014 how I do this now","From now \u2014 how I want to do it"],firstStepSuggestion:"Measure the one thing my VP named, on my current pursuit \u2014 by Friday"},appendixAIntro:["Copy from here \u2014 P1, P2 \u2026 are the pastes named on your module card. Your case workspace, a new chat named after the module. Copilot: if the message is too long, send the skill alone; then your form and your Ledger together in the next message."],prompts:[{id:"P1",title:"Workflow Skill M1 \u2014 Map my workflow today",how:['New chat in your case workspace, "M1 \xB7 My workflow". Paste the skill; under it your Ledger. Send. It asks for your form in one line: sheet Hours, copy A3:C14, paste, send. No placeholders.'],text:`WORKFLOW SKILL M1 \xB7 Map my workflow today
Stage 1 of 7 \xB7 Understand \xB7 AI-Native DCS Academy
Use when: at the start of a new pursuit, or once a quarter, to see where my own pursuit hours go before I change how I work. Not for: measuring anyone else's time, setting targets for my team, or pricing.

INPUTS
1. My Pursuit Ledger \u2014 pasted below this skill. Required: if it is missing, ask me for it before anything else.
2. My workflow form \u2014 my sheet Hours, A3:C14: my last pursuit, my own hours per stage, where it hurt, pursuits a year. It comes with this skill or in my next message.
Anything missing? Reply with one line only, naming what is missing \u2014 the form: "Now paste your workflow form: My Pursuit Workflow, sheet Hours, copy A3:C14."; the Ledger: "Now paste your latest Pursuit Ledger." \u2014 and build nothing until both are in this chat.

RULES
Facts come only from my case documents in this workspace, my Pursuit Ledger and this chat \u2014 no mail, chat, file or web search. Outside code, fictional records and test tasks, start every line or table cell with F [source] (document and section, "Ledger" or "my notes"), A (assumption) or H (hypothesis to validate). Where the sources are silent, write "Not provided \u2014 needs validation". Never decide bid / no-bid, price, margin, staffing or legal terms, and never assess a named person: mark such points "for DCS decision". Anonymised or synthetic material only; if you see a real name or personal data, say so once and continue without it.

STEPS
1. The seven stages, in this order: 1 Understand (M1\u2013M2) \xB7 2 Assess (M3) \xB7 3 Propose (M4\u2013M5) \xB7 4 Define (M6) \xB7 5 Build (M7\u2013M10) \xB7 6 Test (M11) \xB7 7 Show (M12\u2013M14). Hours today: start the cell with my figure exactly as I wrote it \u2014 ranges, "skipped" and "not mine" kept; never rounded, split or estimated by you \u2014 then "\u2014 F [my form], estimate \u2014 to measure" (the figure comes first so a spreadsheet can read it). A stage with no figure: "Not provided \u2014 needs validation". Never add, total or average my hours: my spreadsheet does the sums. Under the table, one line: the stages I left blank, then any I marked "skipped" or "not mine"; or "All seven stages have a figure."
2. Where the time goes, per stage: from my form, tagged F [my form]. Where my form is silent, at most one likely cause, labelled A.
3. The three stages to reclaim: the three with the most hours and the sharpest pain in my form; if my units differ or hours and pain disagree, pick by the pain I named and say so \u2014 never convert my figures; if my pain names fewer than three stages, take the rest by hours in the same unit; if none compare, say so and label the pick A. For each: why this one \xB7 what an AI-supported step would take off my desk \xB7 a good human check, labelled A (what I verify myself, against which source). Hours with the new workflow are mine to estimate in Module 14: never a figure.
4. Self-check before answering: every hour figure is mine and unchanged; no total, sum or average anywhere; no stage is picked for a reason my form does not give. The three stages are about how I work, not about this client: never a case decision.

OUTPUT
(1) My workflow today: one table, 7 rows, columns Stage \xB7 Hours today \xB7 Where the time goes; then the gap line. (2) Three stages to reclaim: one table, 3 rows, columns Stage \xB7 Why this one \xB7 What AI takes off my desk \xB7 Good human check; then one line: "Hours with the workflow: mine to estimate in Module 14 \u2014 to measure."

HUMAN CHECK \u2014 mine, before the gate
- Every hour figure is mine, exactly as I wrote it \u2014 ranges kept, no total from the model.
- The three stages are where my form puts the hours and the pain, not where AI is fashionable.
- Each human check names a source I can open, not "review carefully".

{{DISCIPLINE}}`,discipline:'Workshop output discipline \u2014 Return only what is requested above. No introduction, no recap, no commentary. Hard limits (source tags and labels not counted): (1) max 15 words per cell, the gap line max 20 words; (2) max 20 words per cell \u2014 the F [source] / A / H tag not counted. If information is missing, write: "Not provided \u2014 needs validation." Do not fill gaps unless labelled as an assumption. Close with one line: "Further detail available on request." Nothing after it. A turn that ends on a question or a request to me ends on that line, without this line. (Remove this block after the workshop to receive the full output.)'},{id:"P2",title:"The VP challenge",how:["Same chat. Copy, paste, send \u2014 no placeholders."],text:`Act as the head of my consulting practice \u2014 my VP: sceptical, numerate, short of time. Use only my workflow above, my form and my Pursuit Ledger. Start every line with F [source], A or H.

(1) Three challenges to my picture \u2014 one on my hours, one on the three stages I chose, one on my human checks. For each: the question you would ask me, and the evidence that would satisfy you. Quote my hours only as I wrote them: never add, subtract, compute or estimate a figure.
(2) Your verdict on my three stages: keep them, or swap one, with the reason \u2014 marked "for DCS decision".
(3) The one thing to measure on my next pursuit, so one "estimate \u2014 to measure" becomes a number: what, how, and when I record it.
(4) One thing to stop doing on my next pursuit, taken from my form.

{{DISCIPLINE}}`,discipline:'Workshop output discipline \u2014 Return only what is requested above. No introduction, no recap, no commentary. Hard limits (source tags and labels not counted): four numbered blocks; (1) exactly three challenges, max 35 words each; (2) max 30 words; (3) max 30 words; (4) max 20 words. If information is missing, write: "Not provided \u2014 needs validation." Do not fill gaps unless labelled as an assumption. Close with one line: "Further detail available on request." Nothing after it. A turn that ends on a question or a request to me ends on that line, without this line. (Remove this block after the workshop to receive the full output.)'},{id:"GATE",title:"The gate \u2014 closes every module",how:['Same chat, one message: first your workflow note \u2014 "Workflow note (M1) \u2014 Artefacts, not a decision: I keep \u2026" \u2014 then the gate under it. Send.'],text:`GATE \u2014 close this module. Use only this chat and my last Pursuit Ledger.
(1) The human checks of the Workflow Skill I ran: for each, "shown", "missing" or "mine to confirm", with the evidence in this chat in one line.
(2) My workflow row: a one-row table with the columns Stage \xB7 Module \xB7 Trigger (when I will run this) \xB7 Input \xB7 Workflow Skill \xB7 Human check \xB7 Output.
(3) My updated Pursuit Ledger with exactly these eight fields: 1 Case (client alias \xB7 sector \xB7 what is being bought \xB7 my role \u2014 one line) \xB7 2 Cast (one line per role \u2014 alias \xB7 what they want \xB7 what they will test us on: decision-maker (with H1\u2013H3 in full) \xB7 CFO \xB7 lead evaluator \xB7 delivery lead (ours) \xB7 primary user \xB7 data protection or risk) \xB7 3 One truth (bid decision and its conditions in full, with owners and dates \u2014 later reopen and bid-board conditions included (or the no-bid as recorded) \xB7 phase-1 scope (story IDs with the client's priority) \xB7 budget or cap, and what it includes \xB7 outcome metric with baseline and target, by when \xB7 key dates \xB7 contract form with its parts and its label (decision or H) \xB7 key roles \xB7 latest assessed score per criterion (1\u20135, with its module \u2014 blind re-scores beside it, never instead) \xB7 win themes (titles)) \xB7 4 Stage reached (module and date) \xB7 5 Decisions I took (numbered, each with its module and its conditions in full \u2014 where One truth already states what was decided (the bid conditions included), a short name and the module are enough) \xB7 6 Artefacts (name \xB7 where it lives (chat or file)) \xB7 7 Open \u2014 to validate (what \xB7 with whom \xB7 by when) \xB7 8 Next stage needs (word for word, every line a skill headed "Next stage needs \u2014 for Mx", kept until module x has run; otherwise one line).
Fields 1\u20133 are the fixed block: copy them word for word from my last Ledger and change only what this module changed, marking each change with this module, e.g. "(M8)". Never shorten the cast lines, H1\u2013H3, the bid conditions, the cap and what it includes, commercial figures, the contract form, the scores or the win themes; anything this module adds to fields 1\u20133 for the first time, copy word for word from this chat. Fields 4\u20138 roll: carry every decision with its conditions and every open item forward unless this module closed it (a decision whose content One truth already states needs only a short name and its module); copy word for word any lines a skill headed "Next stage needs \u2014 for Mx" and keep each until module x has run. Labels stay as they are ("H", "to confirm", "practice card"). Record as a decision only what I typed as a decision; everything else stays "Open". A rehearsal or simulation result is "rehearsed \u2014 not validated", never a client fact or an approval. Any condition in One truth whose date is on or before the date I typed (else today) is "met" only if this chat shows it; otherwise add to Open "missed \u2014 reopen qualification (renewal or change request: reopen that decision), for DCS decision". If the Ledger runs long, shorten Artefacts first and list under Open anything you removed; then merge Open items that share an owner, each part keeping its own date, and cut each item to what \xB7 with whom \xB7 by when \u2014 never drop one.

{{DISCIPLINE}}`,discipline:'Workshop output discipline \u2014 Return only what is requested above. No introduction, no recap, no commentary. Hard limits (source tags and labels not counted): (1) one line per check, max 20 words each; (2) one table, one row, 7 columns, max 15 words per cell; (3) the eight field names in bold, "\u2014" for an empty field; fields 1\u20133 in full as above; fields 4\u20137 max 350 words together; field 8 word for word. If information is missing, write: "Not provided \u2014 needs validation." Do not fill gaps unless labelled as an assumption. Close with one line: "Further detail available on request." Nothing after it. A turn that ends on a question or a request to me ends on that line, without this line. (Remove this block after the workshop to receive the full output.)'}],appendixB:[{title:"NO FORM",body:'No form? Take three minutes now in the sheet Hours: your hours for each of the seven stages (a number of hours first \u2014 a range is fine, "skipped" is an answer), where the time goes, then your last pursuit, pursuits a year and where it hurt most. Then copy A3:C14.'},{title:"NEVER LED A FULL PURSUIT",body:'Never led a full pursuit? Use the last one you contributed to, and only the hours you spent yourself. Stages you were not part of: write "not mine".'},{title:"HOURS FOR ONLY A FEW STAGES",body:'Hours for only two or three stages? Run it anyway: the skill marks the rest "Not provided \u2014 needs validation" \u2014 that list is what to measure on your next pursuit.'},{title:"WORKFLOW NOTE, NOT A DECISION",body:'Your three stages are about how you work, not about this client. Type "Workflow note (M1) \u2014 Artefacts, not a decision: I keep \u2026" in the same message as the gate, on top. The gate files it under Artefacts, so your case Decisions stay "\u2014".'},{title:"THE TABLE PASTES AS A PICTURE",body:"In ChatGPT or Gemini, copied Excel cells sometimes land as an image. Paste with Ctrl+Shift+V (Mac: Cmd+Shift+V) \u2014 plain text."},{title:"ROW 5 COUNTS FEWER THAN 7 STAGES",body:'A cell in the sheet Hours starts with words ("about 12", "two days"). Write a number of hours first \u2014 "12", "12h" or "35\u201340". Row 5 also needs "Pursuits I lead in a typical year" for the year figure.'},{title:"YOUR TOOL",body:'Copilot without a case agent, in your case chat: attach your Case Pack (and any file the card names) and start with "Use only the attached file." A private chat gets only what your card says. Everything else \u2014 workspace, private chat, preview, reusable skill \u2014 is on the tool card: Appendix B of your M0 guide, and the Workflow Skills Library.'}]},M2:{num:2,stageName:"Understand",minutes:55,title:"Client Discovery & the Cast",moment:"the RFP is two weeks away",question:"What do we know about this client, and what do we only believe?",intro:"Before you write a word for this client, know what you know and what you only believe. One skill gives you a client pack with every line labelled, the cast you meet again all day, the decision-maker as a hypothesis, and three questions worth asking at your next contact. Then you rehearse them.",steps:[{n:"1",min:"14",do:'Discover the client. New chat in your case workspace, "M2 \xB7 Client": paste the skill, your Ledger under it, send. Read; open two F sources \u2014 any F you cannot trace becomes A. Would you ask the three \u2605 questions yourself?',paste:"P1"},{n:"2",min:"14",do:'The conversation. Same chat: paste the conversation with your first \u2605 question at the end. Up to five questions, one at a time \u2014 say each aloud first: would the client want to answer it? In a rehearsed meeting the client asks its hardest question after your second. Then write "end the meeting".',paste:"P2"},{n:"3",min:"6",do:"Paste your three \u2605 questions into the real meeting invite or Q&A draft (one minute). Then the gate: row M2, your first step, the Ledger.",paste:"Gate"}],beforeGate:"Before the gate: three minutes on your page \u2014 the workflow moment (page 2).",good:["The cast names roles, never people \u2014 and the decision-maker is the role that really decides","Every F traces to a page you can open; the rest is A or H",'The debrief reads "rehearsed \u2014 not validated" on H1\u2013H3, and lists no promise you made'],stuck:["No client documents? Replace [NOTES] in the skill with 6\u201310 sentences of your own notes; a thin, honest pack is the right result.","The model switched to rehearsal? Your documents show rules in force: rehearse your next allowed meeting, with whoever attends it.",'The answer stopped halfway (Copilot)? Type "Continue from where you stopped."'],notATender:'Renewal or change request? Your next contact is often a QBR or a steering committee. Before you send the skill, add this line above your Ledger, as written \u2014 or with your own role titles: "Decision-maker: the role that signs the renewal or approves the change; lead evaluator: the role that scores our service." The model runs shaping \u2014 unless a procurement process or a direct award is open, when rehearsal is correct.',leaveWith:"Client pack (F/A/H) \xB7 the cast you will meet again \xB7 the decision-maker as a hypothesis (H1\u2013H3) \xB7 three \u2605 questions for your next contact \xB7 a scored conversation",page2:{momentHeading:"Workflow moment \u2014 three minutes before the gate",momentQuestion:"How do you prepare a client conversation today \u2014 and which question did the simulated client show you were missing?",momentRows:["When it starts","What I do \xB7 what AI does","What I check myself","Time it takes"],momentCols:["Today \u2014 how I do this now","From now \u2014 how I want to do it"],firstStepSuggestion:"Ask my three \u2605 questions at ______ on ______; each answer goes into my Ledger as F"},appendixAIntro:["Copy from here \u2014 P1, P2 \u2026 are the pastes named on your module card. Your case workspace, a new chat, the module name as the chat name. Copilot: if the message is too long, send the skill alone \u2014 it asks for your Ledger."],prompts:[{id:"P1",title:"Workflow Skill M2 \u2014 Discover the client and set the cast",how:['New chat in your case workspace, "M2 \xB7 Client". Client documents in your workspace? Replace [NOTES \u2014 or "none"] with none. Otherwise with 6\u201310 sentences of notes. Paste your Ledger under the skill; send.'],text:`WORKFLOW SKILL M2 \xB7 Discover the client and set the cast
Stage 1 of 7 \xB7 Understand \xB7 AI-Native DCS Academy
Use when: preparing the next client conversation \u2014 before an RFP, or before the next allowed meeting in a live tender or direct award. Not for: contacting the client, bid / no-bid, pricing or staffing.

INPUTS
1. My Pursuit Ledger \u2014 pasted below this skill. Required: if it is missing, ask me for it before anything else.
2. The client and opportunity documents in this workspace. No documents? My notes, 6\u201310 sentences: [NOTES \u2014 or "none"]
A required input is missing? Ask once, in one line; then write "Not provided \u2014 needs validation" and continue.

RULES
Facts come only from my case documents in this workspace, my Pursuit Ledger and this chat \u2014 no mail, chat, file or web search. Outside code, fictional records and test tasks, start every line or table cell with F [source] (document and section, "Ledger" or "my notes"), A (assumption) or H (hypothesis to validate). Where the sources are silent, write "Not provided \u2014 needs validation". Never decide bid / no-bid, price, margin, staffing or legal terms, and never assess a named person: mark such points "for DCS decision". Anonymised or synthetic material only; if you see a real name or personal data, say so once and continue without it.

STEPS
1. Client pack, as a senior client strategist, six sections: context \xB7 agenda and pressures \xB7 what they are buying and why now \xB7 decision structure (who decides, influences, can block) \xB7 our position \xB7 three unknowns that would change our approach.
2. The cast, by role alias only \u2014 never a name, even where the sources give one: decision-maker \xB7 CFO \xB7 lead evaluator \xB7 delivery lead (ours) \xB7 primary user \xB7 data protection or risk. Each: what they want here \xB7 what they will test us on \u2014 each of these two cells starts with F [source], A or H; the role alias itself takes no label. A role the sources do not show: both cells "Not provided \u2014 needs validation".
3. The decision-maker as a persona, titled by role alias, a hypothesis, not a fact: measured on \xB7 wants from this \xB7 fears \xB7 good at month six \xB7 evidence they trust \xB7 H1 \xB7 H2 \xB7 H3, each H with the question that validates it. A belief only where the sources give a basis; otherwise "Not provided \u2014 needs validation". (If I later ask for the primary user's persona, use the same format.)
4. My next allowed contact, one line: meeting or round (a clarification meeting, the written Q&A round \u2014 answers published to all bidders, orals, a QBR, a steering committee, a sponsor meeting) \xB7 date \xB7 the cast role who attends (the decision-maker unless the rules send me elsewhere) \xB7 the rules in force at my Ledger's date (tender, direct award, contact rules) [source]. Then five questions for that contact: open (what, how, which), each tied to an H or unknown \xB7 what changes in our approach if the answer surprises us. \u2605 on the three to ask first.
5. Self-check: every line labelled; no persona belief without a basis; no name anywhere. Then, for my Ledger: six cast lines (alias \u2014 wants \u2014 will test us on, labelled as in the cast table); under the decision-maker's line, H1, H2 and H3 in full, word for word from the persona; and one Open line: H1\u2013H3 \u2014 to validate \u2014 with whom \u2014 when.

OUTPUT
(1) Pack: six headed sections, max 2 bullets each, three for the unknowns. (2) Cast: one table, 6 rows, 3 columns (role alias \xB7 wants here \xB7 will test us on). (3) Persona of the decision-maker: one table, 8 rows, 3 columns (field \xB7 what we believe \xB7 validating question). (4) The next-contact line, then one table, 5 rows, 3 columns, \u2605 on exactly three. (5) For the Ledger: ten lines.

HUMAN CHECK \u2014 mine, before the gate
- Every F carries a source I can open; anything I cannot trace becomes A or H.
- The cast names roles, not people, and the decision-maker is the role that really decides.
- My next allowed contact and my three \u2605 questions fit the rules in force \u2014 and I would ask them myself.

{{DISCIPLINE}}`,discipline:'Workshop output discipline \u2014 Return only what is requested above. No introduction, no recap, no commentary. Hard limits (source tags and labels not counted): (1) max 20 words per bullet; (2)\u2013(4) max 15 words per cell, the next-contact line max 35 words; (5) max 20 words per line \u2014 labels and source tags not counted. If information is missing, write: "Not provided \u2014 needs validation." Do not fill gaps unless labelled as an assumption. Close with one line: "Further detail available on request." Nothing after it. A turn that ends on a question or a request to me ends on that line, without this line. (Remove this block after the workshop to receive the full output.)'},{id:"P2",title:"The conversation",how:['Same chat. Replace [QUESTION 1] with your first \u2605 question; send. Then one question per message, up to five; then write "end the meeting". Contact rules your documents do not show? Start your first question with the word "rehearsal".'],text:`The conversation. You are the cast role who attends my next allowed contact, as named above \u2014 the decision-maker if none is named \u2014 speaking as its cast line and persona describe (no persona: the cast line and the documents only): busy, courteous, slightly guarded, testing whether I understand your business. Stay in role until I write: end the meeting.

to find out before you decide.','A percentage you never gave? "Out. Expected value stays in words until finance gives a figure."',"Not ready to decide? Type nothing: the gate keeps it Open \u2014 that is honest too."],notATender:'Renewal? The committee recommends renew, reshape or let go. Change request? Accept, reshape or decline. "Evaluation criteria" become how the client will judge it; the model labels them H. Type your decision with the same words.',leaveWith:"Snapshot \xB7 delivery-critical requirements \xB7 evaluation logic with price sensitivity \xB7 three win themes \xB7 a decision with dated conditions, each with an owner",page2:{momentHeading:"Workflow moment \u2014 three minutes before the gate",momentQuestion:"How do you decide to bid today \u2014 who decides, on what, written down where? What would your VP ask about your conditions?",momentRows:["When it starts","What I do \xB7 what AI does","What I check myself","Time it takes"],momentCols:["Today \u2014 how I do this now","From now \u2014 how I want to do it"],firstStepSuggestion:"At my next go / no-go on ______, write the conditions with an owner and a date each"},appendixAIntro:["Copy from here \u2014 P1, P2 \u2026 are the pastes named on your module card. Your case workspace, a new chat, the module name as the chat name. Copilot: if the message is too long, send the skill alone \u2014 it asks for your Ledger."],prompts:[{id:"P1",title:"Workflow Skill M3 \u2014 Assess the opportunity",how:['New chat in your case workspace, "M3 \xB7 Assess". RFP in your workspace? Replace [NOTES \u2014 or "none"] with none; otherwise with 8\u201312 sentences. Paste your Ledger under the skill; send.'],text:`WORKFLOW SKILL M3 \xB7 Assess the opportunity
Stage 2 of 7 \xB7 Assess \xB7 AI-Native DCS Academy
Use when: an RFP, tender or opportunity brief lands, before pursuit hours are committed. Not for: pricing, legal review or staffing decisions.

INPUTS
1. My Pursuit Ledger \u2014 pasted below this skill. Required: if it is missing, ask me for it before anything else.
2. The RFP or opportunity documents in this workspace. No documents? My notes, 8\u201312 sentences: [NOTES \u2014 or "none"]
A required input is missing? Ask once, in one line; then write "Not provided \u2014 needs validation" and continue.

RULES
Facts come only from my case documents in this workspace, my Pursuit Ledger and this chat \u2014 no mail, chat, file or web search. Outside code, fictional records and test tasks, start every line or table cell with F [source] (document and section, "Ledger" or "my notes"), A (assumption) or H (hypothesis to validate). Where the sources are silent, write "Not provided \u2014 needs validation". Never decide bid / no-bid, price, margin, staffing or legal terms, and never assess a named person: mark such points "for DCS decision". Anonymised or synthetic material only; if you see a real name or personal data, say so once and continue without it.

STEPS
1. Snapshot, as a senior pursuit director: what is being bought \xB7 scope in and out \xB7 key dates \xB7 budget or value \xB7 evaluation criteria and weights \xB7 procurement constraints, contact rules included \xB7 decision-maker and evaluators \xB7 incumbent and competition \xB7 our relationship and history \xB7 unknowns that would change our approach. Under it, a line "Early feasibility": data (access, quality) \xB7 capability (done before?) \xB7 delivery (people, dates); and, if my Ledger, notes or documents plan a client contact the rules do not allow, a line flagging it.
2. The eight requirements that matter most for delivery: the requirement with its source \xB7 what it means for delivery \xB7 the one question for our delivery lead \xB7 risk High, Medium or Low. Fewer if the sources hold fewer; none that is not in them.
3. Evaluation, as the client's panel, against the published criteria: for each criterion, what a top score must show \xB7 our evidence today \xB7 our likely score 1\u20135 (1\u20132 where we have no evidence) \xB7 the action that raises it most. More than 10 published criteria: group sub-criteria under their parent, weights summed. Price: if the scoring formula is published, state in relative terms what being 5% and 10% above the lowest compliant price would cost in weighted points, and, for comparison, what one more point on the heaviest quality criterion is worth; set no price. No published criteria: say so and use the dimensions this client will most likely judge on, labelled H.
4. Three win themes against the competition named in the sources, each a title of max six words, then: what we would prove \xB7 why it beats the alternative \xB7 the evidence it still needs; each H.
5. Self-check: every number has a source; nothing scored above 2 without evidence; nothing decided for me.

OUTPUT
(1) Snapshot: one table, 10 rows, 2 columns; then its lines. (2) Requirements: one table, max 8 rows, 4 columns. (3) Evaluation: one table, one row per published criterion (max 10), 5 columns; a line on our weighted position in words (strong, competitive or weak; no invented percentages); one on price sensitivity; one headed "Next stage needs \u2014 for M4:" naming the quality criterion, not price, that loses most weighted points \u2014 weight \xD7 (5 \u2212 score), figure shown; a tie: both; no weights: of the dimensions the decision-maker weighs most, the lowest-scored one, score shown, H. (4) Three win themes, one line each, title first.

HUMAN CHECK \u2014 mine, before the gate
- Weights, dates and value match the RFP, line by line.
- Every score of 3 or more rests on evidence I could show the panel tomorrow.
- Nothing here plans a client contact the procurement rules forbid.
